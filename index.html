<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--bg:#0f0f0f;--bg2:#212121;--bg3:#272727;--text:#f1f1f1;--text2:#aaa;--text3:#717171;--border:#3f3f3f;--red:#ff0000;--hover:#272727;--sidebar:240px;--hh:56px;--radius:12px;}html{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;}body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}button{background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;font-size:inherit;}input{font-family:inherit;font-size:inherit;}img{display:block;max-width:100%;}svg{flex-shrink:0;display:block;}::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px;}#hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--hh);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;border-bottom:1px solid #222;}.hl{display:flex;align-items:center;gap:2px;}#menuBtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;margin-right:10px;}#menuBtn:hover{background:var(--hover);}.logo{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:4px 8px;border-radius:6px;}.logo-mark{width:28px;height:20px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}.logo-name{font-size:18px;font-weight:700;letter-spacing:-.5px;color:var(--text);}.hc{display:flex;align-items:center;gap:8px;flex:1;max-width:600px;margin:0 auto;}#searchForm{display:flex;flex:1;height:40px;}#searchInput{flex:1;height:100%;padding:0 16px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-right:none;border-radius:40px 0 0 40px;outline:none;font-size:15px;}#searchInput:focus{border-color:#1c62b9;}#searchBtn{width:64px;height:100%;background:var(--bg2);border:1px solid var(--border);border-left:none;border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;color:var(--text);}.hr{display:flex;align-items:center;gap:12px;}.ibtn{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}.ibtn:hover{background:var(--bg3);}.avatar{width:32px;height:32px;border-radius:50%;background:#555;overflow:hidden;}.avatar img{width:100%;height:100%;object-fit:cover;}#layout{display:flex;margin-top:var(--hh);}#sidebar{width:var(--sidebar);min-width:var(--sidebar);position:fixed;top:var(--hh);left:0;bottom:0;overflow-y:auto;background:var(--bg);padding:12px 12px 24px;z-index:100;}.si{display:flex;align-items:center;gap:24px;padding:0 12px;height:40px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:400;color:var(--text);margin-bottom:2px;}.si:hover{background:var(--hover);}.si.active{background:var(--bg3);font-weight:500;}.sdiv{border:none;border-top:1px solid var(--border);margin:12px 0;}.ssec{padding:4px 12px 8px;font-size:14px;font-weight:500;color:var(--text);}.sub-item{display:flex;align-items:center;gap:16px;padding:0 12px;height:36px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text);}.sub-item:hover{background:var(--hover);}.sub-dot{width:6px;height:6px;background:#3ea6ff;border-radius:50%;margin-left:auto;}#main{margin-left:var(--sidebar);flex:1;padding:24px;background:var(--bg);min-height:calc(100vh - var(--hh));}.sec-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;margin:24px 0 16px;}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 16px;margin-bottom:32px;}.vc{cursor:pointer;}.vthumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}.vthumb img{width:100%;height:100%;object-fit:cover;}.vmeta{display:flex;gap:12px;}.vavatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;overflow:hidden;}.vavatar img{width:100%;height:100%;object-fit:cover;}.vtitle{font-size:15px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.vchan{font-size:13px;color:var(--text2);margin-bottom:2px;}.vstats{font-size:13px;color:var(--text2);}#shortsView{display:none;width:100%;height:calc(100vh - 80px);justify-content:center;align-items:center;}.short-player-box{width:360px;height:640px;background:#000;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.8);}.short-player-box iframe{width:100%;height:100%;border:none;}</style></head><body><header id="hdr"><div class="hl"><button id="menuBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="logo" id="homeLogo"><div class="logo-mark"><svg width="14" height="10" viewBox="0 0 16 12" fill="none"><polygon points="5,0 16,6 5,12" fill="#fff"/></svg></div><span class="logo-name">NoveTube</span></div></div><div class="hc"><form id="searchForm"><input id="searchInput" type="search" placeholder="Search"><button id="searchBtn" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button></form></div><div class="hr"><div class="ibtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2zm3-7H3v12h14v-3h2V6h-2z"/></svg></div><div class="ibtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></div><div class="avatar"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100"></div></div></header><div id="layout"><nav id="sidebar"><div class="si active" id="navHome"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 21V10.08l8-6.92 8 6.92V21h-5v-6h-6v6H4z"/></svg>Home</div><div class="si" id="navShorts"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.46.93 2.68 2.22 3.18l1.25.5-1.43.76c-1.84.96-2.53 3.23-1.56 5.07.97 1.83 3.24 2.52 5.07 1.56l8.49-4.44c1.29-.68 2.07-2.04 2-3.49-.07-1.46-.93-2.68-2.22-3.18zM10 15.5v-7l6 3.5-6 3.5z"/></svg>Shorts</div><hr class="sdiv"><div class="ssec">Subscriptions</div><div class="sub-item"><div class="avatar"><img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=50"></div>Aviooli<div class="sub-dot"></div></div><div class="sub-item"><div class="avatar"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=50"></div>ItsFunneh<div class="sub-dot"></div></div></nav><main id="main"><div id="homeView"><div id="videoGrid"></div></div><div id="shortsView"><div class="short-player-box"><iframe id="shortsIframe" src="" allow="autoplay"></iframe></div></div></main></div><script>"use strict";
const $=id=>document.getElementById(id);
const INVIDIOUS_API="https://invidious.jing.rocks/api/v1";

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtViews(n){n=parseInt(n)||0;if(n>=1e9)return(n/1e9).toFixed(1)+'B views';if(n>=1e6)return(n/1e6).toFixed(1)+'M views';if(n>=1e3)return Math.round(n/1e3)+'K views';return n+' views';}
function fmtAgo(s){if(!s)return'';const sec=parseInt(s);if(sec<60)return'just now';if(sec<3600)return Math.floor(sec/60)+' min ago';if(sec<86400)return Math.floor(sec/3600)+' hours ago';if(sec<2592000)return Math.floor(sec/86400)+' days ago';return Math.floor(sec/31536000)+' years ago';}

async function loadHome(){
  $('homeView').style.display='block';$('shortsView').style.display='none';
  const grid=$('videoGrid');
  grid.innerHTML='<p style="color:#aaa">Loading trending vids...</p>';
  try{
    const res=await fetch(`${INVIDIOUS_API}/trending?region=US`);
    const videos=await res.json();
    grid.innerHTML='';
    videos.slice(0,20).forEach(v=>{
      const id=v.videoId;
      const title=v.title;
      const chan=v.author;
      const thumb=v.videoThumbnails?.[0]?.url||`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
      const avUrl=v.authorThumb||'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=50';
      const views=v.viewCount;
      const timeStr=fmtAgo(v.published);
      const el=document.createElement('div');el.className='vc';
      el.innerHTML=`<div class="vthumb"><img src="${esc(thumb)}" loading="lazy"></div><div class="vmeta"><div class="vavatar"><img src="${esc(avUrl)}"></div><div style="min-width:0"><div class="vtitle">${esc(title)}</div><div class="vchan">${esc(chan)}</div><div class="vstats">${fmtViews(views)} · ${timeStr}</div></div></div>`;
      el.onclick=()=>window.open('https://www.youtube.com/watch?v='+id,'_blank');
      grid.appendChild(el);
    });
  }catch(e){
    grid.innerHTML=`<p style="color:#ff4444">Failed to load via alternative API: ${esc(e.message)}</p>`;
  }
}

function loadShortsTab(){
  $('homeView').style.display='none';$('shortsView').style.display='flex';
  const shortIds=["q8RbnLMAlAA","dQw4w9WgXcQ","jNQXAC9IVRw","9bZkp7q19f0"];
  const randomId=shortIds[Math.floor(Math.random()*shortIds.length)];
  history.pushState({},'',`shorts/${randomId}`);
  $('shortsIframe').src=`https://www.youtube.com/embed/${randomId}?autoplay=1&loop=1&playlist=${randomId}`;
}

$('navHome').onclick=()=>{ history.pushState({},'','/'); loadHome(); };$('navShorts').onclick=loadShortsTab;
$('homeLogo').onclick=()=>{
  history.pushState({},'','/');
  loadHome();
};

loadHome();
</script></body></html>
