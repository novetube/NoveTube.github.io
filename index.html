<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><style>*,::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0f0f;--bg2:#212121;--text:#f1f1f1;--text2:#aaa;--border:#3f3f3f;--red:#ff0000}html,body{background:var(--bg);color:var(--text);font-family:sans-serif;font-size:14px;min-height:100vh}body{display:flex;flex-direction:column}header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);z-index:200}.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:20px}.logo-mark{width:34px;height:24px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center}#main{margin-top:56px;padding:24px;flex:1}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.vc{cursor:pointer}.vthumb{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}.vthumb img{width:100%;height:100%;object-fit:cover}.vtitle{font-weight:500;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vchan{font-size:12px;color:var(--text2)}</style></head><body><header><div class="logo"><div class="logo-mark">▶</div>NoveTube</div></header><main id="main"><div id="videoGrid"></div></main><script>const apiKey='__YOUTUBE_API_KEY__';async function loadVideos(){const g=document.getElementById('videoGrid');if(apiKey.startsWith('__')){g.innerHTML='<p style="color:#ff4444">action didn inject key yet</p>';return;}g.innerHTML='<p style="color:#aaa">loading...</p>';try{const r=await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=20&regionCode=US&key='+apiKey);const d=await r.json();if(!r.ok){throw new Error(d.error?.message||'http '+r.status)}if(d.items&&d.items.length>0){g.innerHTML='';d.items.forEach(v=>{const id=v.id,t=v.snippet.title,c=v.snippet.channelTitle,th=v.snippet.thumbnails.high?v.snippet.thumbnails.high.url:v.snippet.thumbnails.default.url,el=document.createElement('div');el.className='vc';el.innerHTML='<div class="vthumb"><img src="'+th+'"></div><div class="vtitle">'+t+'</div><div class="vchan">'+c+'</div>';el.onclick=()=>location.href='https://www.youtube.com/watch?v='+id;g.appendChild(el);})}else{g.innerHTML='<p style="color:#ff4444">no vids</p>'}}catch(e){g.innerHTML='<p style="color:#ff4444">err: '+e.message+'</p>'}}loadVideos();</script></body></html>
