<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--bg:#0f0f0f;--bg2:#212121;--bg3:#272727;--bg4:#1e1e1e;--text:#f1f1f1;--text2:#aaaaaa;--text3:#717171;--border:#3f3f3f;--red:#ff0000;--red2:#cc0000;--hover:#272727;--sidebar:240px;--hh:56px;--radius:12px;}html{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;}body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}button{background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;font-size:inherit;}input{font-family:inherit;font-size:inherit;}img{display:block;max-width:100%;}svg{flex-shrink:0;display:block;}::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px;}::-webkit-scrollbar-thumb:hover{background:#555;}#hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--hh);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;border-bottom:1px solid #1a1a1a;}.hl{display:flex;align-items:center;gap:2px;}#menuBtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;margin-right:10px;}#menuBtn:hover{background:var(--hover);}.logo{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:4px 8px;border-radius:6px;transition:background .1s;}.logo:hover{background:var(--hover);}.logo-mark{width:32px;height:22px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}.logo-name{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1;color:var(--text);}.hc{display:flex;align-items:center;gap:8px;flex:1;max-width:720px;margin:0 auto;}#searchForm{display:flex;flex:1;height:40px;}#searchInput{flex:1;height:100%;padding:0 16px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-right:none;border-radius:40px 0 0 40px;outline:none;font-size:15px;}#searchInput:focus{border-color:#1c62b9;}#searchBtn{width:64px;height:100%;flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-left:none;border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;color:var(--text);}#layout{display:flex;margin-top:var(--hh);}#sidebar{width:var(--sidebar);min-width:var(--sidebar);position:fixed;top:var(--hh);left:0;bottom:0;overflow-y:auto;background:var(--bg);padding:12px 0 24px;z-index:100;}.si{display:flex;align-items:center;gap:20px;padding:0 16px;height:40px;border-radius:10px;margin:0 8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);} .si:hover{background:var(--hover);}.si.active{background:var(--bg3);}#main{margin-left:var(--sidebar);flex:1;padding:20px 24px 48px;min-height:calc(100vh - var(--hh));background:var(--bg);}.sdiv{border:none;border-top:1px solid var(--border);margin:10px 0;}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 16px;}.vc{cursor:pointer;}.vthumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}.vthumb img{width:100%;height:100%;object-fit:cover;}.vmeta{display:flex;gap:12px;padding:0 2px;}.vavatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);}.vavatar img{width:100%;height:100%;object-fit:cover;}.vtitle{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.vchan{font-size:13px;color:var(--text2);margin-bottom:2px;}.vstats{font-size:12px;color:var(--text3);}#viewContainer{display:none;width:100%;height:calc(100vh - 56px);justify-content:center;align-items:center;background:#000;}.shorts-player{width:360px;height:640px;background:#111;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.8);} .shorts-player iframe{width:100%;height:100%;border:none;}</style></head><body><header id="hdr"><div class="hl"><button id="menuBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="logo" id="homeBtn"><div class="logo-mark"><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><polygon points="5,0 16,6 5,12" fill="#fff"/></svg></div><span class="logo-name">NoveTube</span></div></div><div class="hc"><form id="searchForm"><input id="searchInput" type="search" placeholder="Search…"><button id="searchBtn" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button></form></div><div id="apiStatus" style="font-size:11px;padding:5px 10px;background:#212121;border-radius:6px;color:#aaa">Checking...</div></header><div id="layout"><nav id="sidebar"><div class="si active" id="navHome">Home</div><div class="si" id="navShorts">Shorts</div><hr class="sdiv"><div class="si" id="navChan">@debugy/videos</div></nav><main id="main"><div id="feedView"><div id="videoGrid"></div><div id="loadingMore" style="text-align:center;padding:20px;color:#aaa;display:none">Loading more vids...</div></div><div id="viewContainer"></div></main></div><script>"use strict";
const API_KEY="__YOUTUBE_API_KEY__";
const API_BASE="https://www.googleapis.com/youtube/v3";
const $=id=>document.getElementById(id);
let nextPageToken="",currentContext="home",channelIdCache={};
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtViews(n){n=parseInt(n)||0;if(n>=1e9)return(n/1e9).toFixed(1)+'B views';if(n>=1e6)return(n/1e6).toFixed(1)+'M views';if(n>=1e3)return Math.round(n/1e3)+'K views';return n+' views';}
function fmtAgo(iso){if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hours ago';if(s<2592000)return Math.floor(s/86400)+' days ago';return Math.floor(s/31536000)+' years ago';}
function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}

async function apiReq(endpoint,params={}){
  const url=new URL(API_BASE+'/'+endpoint);
  Object.entries({...params,key:API_KEY}).forEach(([k,v])=>v!=null&&url.searchParams.set(k,v));
  const res=await fetch(url);const data=await res.json();
  if(!res.ok||data.error)throw new Error(data?.error?.message||'HTTP '+res.status);
  $('apiStatus').textContent="API live";$('apiStatus').className="ok";return data;
}

async function fetchChannelThumbs(channelIds){
  const missing=channelIds.filter(id=>!channelIdCache[id]);
  if(missing.length===0)return;
  try{
    const data=await apiReq('channels',{part:'snippet',id:missing.join(',')});
    data.items.forEach(c=>{channelIdCache[c.id]=c.snippet.thumbnails?.default?.url;});
  }catch(e){}
}

async function loadVideos(append=false){
  if(!append)$('videoGrid').innerHTML='';
  try{
    const data=await apiReq('videos',{part:'snippet,statistics',chart:'mostPopular',maxResults:20,regionCode:'US',pageToken:nextPageToken});
    nextPageToken=data.nextPageToken||"";
    const channelIds=[...new Set(data.items.map(v=>v.snippet.channelId))];
    await fetchChannelThumbs(channelIds);
    data.items.forEach(v=>{
      const id=v.id, title=v.snippet.title, chan=v.snippet.channelTitle, cId=v.snippet.channelId;
      const thumb=v.snippet.thumbnails.high?.url||v.snippet.thumbnails.default?.url;
      const views=v.statistics?.viewCount, date=v.snippet.publishedAt;
      const thumbUrl=channelIdCache[cId];
      const avHtml=thumbUrl?`<img src="${esc(thumbUrl)}">`:`<span>${esc(initials(chan))}</span>`;
      const el=document.createElement('div');el.className='vc';
      el.innerHTML=`<div class="vthumb"><img src="${esc(thumb)}" loading="lazy"></div><div class="vmeta"><div class="vavatar">${avHtml}</div><div style="min-width:0"><div class="vtitle">${esc(title)}</div><div class="vchan">${esc(chan)}</div><div class="vstats">${views?fmtViews(views)+' · ':''}${fmtAgo(date)}</div></div></div>`;
      el.onclick=()=>location.href='https://www.youtube.com/watch?v='+id;
      $('videoGrid').appendChild(el);
    });
  }catch(e){$('videoGrid').innerHTML='<p style="color:#ff4444">Error loading videos</p>';}
}

// Shorts Tab implementation without YouTube API search restrictions
async function loadShorts(){
  currentContext="shorts";
  const rands=["q8RbnLMAlAA","dQw4w9WgXcQ","jNQXAC9IVRw","9bZkp7q19f0","kJQP7kiw5Fk"];
  const randomShortId=rands[Math.floor(Math.random()*rands.length)];
  history.pushState({},'',`shorts/${randomShortId}`);
  $('feedView').style.display='none';
  const vc=$('viewContainer');
  vc.style.display='flex';
  vc.innerHTML=`<div class="shorts-player"><iframe src="https://www.youtube.com/embed/${randomShortId}?autoplay=1&loop=1&playlist=${randomShortId}" allow="autoplay"></iframe></div>`;
}

$('navHome').onclick=()=>{
  currentContext="home";history.pushState({},'',document.location.pathname);
  $('viewContainer').style.display='none';$('feedView').style.display='block';
};
$('navShorts').onclick=loadShorts;
$('navChan').onclick=()=>{
  currentContext="chan";history.pushState({},'','@debugy/videos');
  $('viewContainer').style.display='none';$('feedView').style.display='block';
  loadVideos(false);
};

window.onscroll=()=>{
  if(currentContext==="home"&&window.innerHeight+window.scrollY>=document.body.offsetHeight-500){
    loadVideos(true);
  }
};

loadVideos(false);
</script></body></html>
