
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoveTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#0f0f0f;--bg2:#212121;--bg3:#303030;--text:#f1f1f1;--muted:#aaa;--border:#383838;--red:#f00;--hh:56px;--sw:230px}
body{background:var(--bg);color:var(--text);font:14px Roboto,Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;color:inherit;background:none;cursor:pointer}img{display:block;max-width:100%}#hdr{position:fixed;inset:0 0 auto;height:var(--hh);z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #222}.left,.right{display:flex;align-items:center;gap:10px}.left{flex-shrink:0}.right{margin-left:auto}.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.iconbtn:hover{background:var(--bg3)}.logo{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:19px;font-weight:700}.mark{background:var(--red);width:28px;height:20px;border-radius:5px;display:grid;place-items:center}.search{display:flex;max-width:640px;flex:1;margin:auto;height:40px}.search input{min-width:0;flex:1;background:var(--bg);color:white;border:1px solid var(--border);border-radius:24px 0 0 24px;padding:0 16px;outline:none}.search input:focus{border-color:#246fc4}.search button{width:60px;background:var(--bg2);border:1px solid var(--border);border-radius:0 24px 24px 0;display:grid;place-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:#444;object-fit:cover;flex-shrink:0}
#sidebar{position:fixed;top:var(--hh);bottom:0;left:0;width:var(--sw);overflow:auto;padding:12px;z-index:10;background:var(--bg);transition:transform .2s}.nav{height:42px;display:flex;align-items:center;gap:22px;padding:0 12px;border-radius:10px;cursor:pointer}.nav:hover,.sub:hover{background:var(--bg2)}.nav.active{background:var(--bg3);font-weight:700}.rule{border:0;border-top:1px solid var(--border);margin:14px 0}.subheading{padding:4px 12px 10px;font-weight:700}.sub{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px}
#main{margin-left:var(--sw);padding:20px 24px;min-height:100vh;padding-top:calc(var(--hh) + 20px);transition:margin .2s}body.collapsed #sidebar{transform:translateX(-100%)}body.collapsed #main{margin-left:0}
#categories{display:flex;gap:10px;overflow-x:auto;padding:0 0 20px;scrollbar-width:none;position:sticky;top:var(--hh);background:var(--bg);z-index:5}#categories::-webkit-scrollbar{display:none}.chip{white-space:nowrap;background:#272727;padding:9px 13px;border-radius:8px;font-weight:500}.chip:hover{background:#404040}.chip.active{background:var(--text);color:#111}
#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:28px 16px}.vc{cursor:pointer;min-width:0}.thumb{aspect-ratio:16/9;background:#202020;border-radius:12px;overflow:hidden;margin-bottom:11px}.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.vc:hover .thumb img{transform:scale(1.025)}.meta{display:flex;gap:12px}.vavatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333;flex-shrink:0}.vinfo{min-width:0}.vtitle{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.muted{color:var(--muted);font-size:13px;line-height:1.6;overflow-wrap:anywhere}.status{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 12px;line-height:2}.status button{background:var(--bg3);padding:10px 16px;border-radius:20px}
#watchView{display:none;max-width:1200px;margin:0 auto}.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}.player{width:100%;aspect-ratio:16/9;background:#000;border:0;border-radius:12px}.watch-title{font-size:21px;font-weight:700;margin:14px 0}.watch-author{color:var(--muted);margin:10px 0 20px}.watch-related{display:grid;grid-template-columns:1fr;gap:16px}.related{display:flex;gap:10px;cursor:pointer}.related .thumb{width:45%;flex-shrink:0;margin:0}.related .vtitle{font-size:14px}
#shortsView{display:none;justify-content:center;gap:16px;min-height:calc(100vh - 90px);align-items:center}.short-stage{height:min(78vh,760px);height:min(78dvh,760px);aspect-ratio:9/16;max-width:100%;position:relative;background:#000;border-radius:14px;overflow:hidden;touch-action:pan-y}.short-stage iframe{width:100%;height:100%;border:0}.short-controls{display:flex;flex-direction:column;gap:12px}.short-arrow{width:44px;height:44px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:24px}.short-arrow:hover{background:#484848}.short-label{color:var(--muted);font-size:12px;text-align:center;margin-top:5px}
@media(max-width:1000px){.watch-layout{grid-template-columns:1fr}.watch-related{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
@media(max-width:650px){#hdr{padding:0 7px;gap:7px}.left{gap:2px}.logo{font-size:16px;gap:4px}.iconbtn{width:34px}.search{height:36px}.search input{padding:0 9px;width:50px}.search button{width:40px}.right .iconbtn{display:none}#sidebar{width:240px;box-shadow:5px 0 20px #0006}#main{margin-left:0;padding:calc(var(--hh) + 14px) 12px 20px}#categories{top:var(--hh)}#videoGrid{grid-template-columns:1fr;gap:24px}.thumb{border-radius:9px}#shortsView{min-height:calc(100dvh - 90px);gap:6px}.short-stage{height:76dvh;height:min(76dvh,720px);width:auto;max-width:calc(100vw - 75px);border-radius:10px}.short-controls{gap:8px}.short-arrow{width:38px;height:38px}#watchView{padding:0}.player{border-radius:0}.watch-title{font-size:18px}}
</style>
</head>
<body>
<header id="hdr">
<div class="left">
<button class="iconbtn" id="menuBtn" aria-label="Toggle menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
<div class="logo" id="homeLogo"><span class="mark"><svg width="14" height="10" viewBox="0 0 16 12"><path d="M5 0 16 6 5 12Z" fill="white"/></svg></span>NoveTube</div>
</div>
<form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Search" aria-label="Search videos"><button aria-label="Search"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l5.27 5.27 1.49-1.49zM9.5 14A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9"/></svg></button></form>
<div class="right"><img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile"></div>
</header>
<nav id="sidebar">
<div class="nav active" id="navHome"><span>⌂</span>Home</div>
<div class="nav" id="navShorts"><span>▷</span>Shorts</div>
<hr class="rule"><div class="subheading">Subscriptions</div>
<div class="sub"><img class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=50" alt="">Aviooli</div>
<div class="sub"><img class="avatar" src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=50" alt="">ItsFunneh</div>
<hr class="rule">
<div class="subheading">Your recommendations</div>
<div class="muted" style="padding:0 12px">Recommendations adapt to the videos you watch on this device.</div>
</nav>
<main id="main">
<section id="homeView">
<div id="categories"></div>
<div id="videoGrid"></div>
</section>
<section id="watchView">
<div class="watch-layout"><div>
<iframe class="player" id="watchPlayer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video player"></iframe>
<h1 class="watch-title" id="watchTitle">Loading video...</h1>
<div class="watch-author" id="watchAuthor"></div>
</div><div class="watch-related" id="watchRelated"></div></div>
</section>
<section id="shortsView">
<div class="short-stage" id="shortStage"><iframe id="shortPlayer" title="Shorts player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<div class="short-controls"><button class="short-arrow" id="shortUp" aria-label="Previous Short">↑</button><button class="short-arrow" id="shortDown" aria-label="Next Short">↓</button><div class="short-label">SCROLL</div></div>
</section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const INVIDIOUS_API="https://invidious.jing.rocks/api/v1";
const CATEGORIES=["All","Gaming","Roblox","Minecraft","Music","Entertainment","Education","Technology","News","Science","Sports","Comedy"];
const SHORTS=[];
let view="home",query="",category="All",videos=[],watchId="",shortIndex=0,shortBusy=false,requestId=0,scrollTimer;
const getStore=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const setStore=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const historyVideos=()=>getStore("novetube_history",[]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtViews=n=>{n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(1)+"B views":n>=1e6?(n/1e6).toFixed(1)+"M views":n>=1e3?Math.round(n/1e3)+"K views":n+" views"};
const fmtAgo=n=>{n=Number(n)||0;if(n<60)return"Recently";if(n<3600)return Math.floor(n/60)+" min ago";if(n<86400)return Math.floor(n/3600)+" hours ago";if(n<2592000)return Math.floor(n/86400)+" days ago";if(n<31536000)return Math.floor(n/2592000)+" months ago";return Math.floor(n/31536000)+" years ago"};
function videoCategory(v){
const s=(v.title+" "+v.author+" "+(v.description||"")).toLowerCase();
if(/roblox/.test(s))return"Roblox";
if(/minecraft/.test(s))return"Minecraft";
if(/gaming|gameplay|fortnite|valorant|gta|speedrun|playthrough/.test(s))return"Gaming";
if(/music|song|official video|lyrics|remix|phonk|vocaloid/.test(s))return"Music";
if(/science|space|physics|chemistry|biology/.test(s))return"Science";
if(/tutorial|learn|lesson|education|how to|explained/.test(s))return"Education";
if(/technology|tech review|iphone|android|computer|programming/.test(s))return"Technology";
if(/football|basketball|sport|match highlights/.test(s))return"Sports";
if(/news|politics|breaking/.test(s))return"News";
if(/comedy|funny|memes|prank/.test(s))return"Comedy";
return"Entertainment";
}
function renderCategories(){
$("categories").innerHTML=CATEGORIES.map(c=>`<button class="chip${category===c?" active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
$("categories").querySelectorAll("button").forEach(b=>b.onclick=()=>selectCategory(b.dataset.cat));
}
function status(msg,retry=false){$("videoGrid").innerHTML=`<div class="status">${esc(msg)}${retry?'<br><button id="retry">Try again</button>':""}</div>`;if(retry)$("retry").onclick=()=>loadVideos(query,category)}
async function api(path){const r=await fetch(`${INVIDIOUS_API}${path}`);if(!r.ok)throw Error("API returned HTTP "+r.status);const d=await r.json();if(!Array.isArray(d))throw Error("Unexpected API response");return d}
function recordWatch(v){
let h=historyVideos().filter(x=>x.id!==v.videoId);
h.unshift({id:v.videoId,title:v.title,author:v.author,category:videoCategory(v),time:Date.now()});
setStore("novetube_history",h.slice(0,100));
}
function recommendationQuery(){
const h=historyVideos();
if(!h.length)return"";
const counts={};h.slice(0,20).forEach(v=>counts[v.category]=(counts[v.category]||0)+1);
return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
}
async function loadVideos(q="",cat="All"){
const token=++requestId;query=q;category=cat;renderCategories();status(q?"Searching videos...":cat!=="All"?"Loading "+cat+" videos...":"Loading recommendations...");
try{
let results=[];
if(q)results=await api("/search?q="+encodeURIComponent(q)+"&type=video");
else if(cat!=="All")results=await api("/search?q="+encodeURIComponent(cat)+"&type=video");
else{
const rec=recommendationQuery();
const tasks=[api("/trending?region=US")];
if(rec)tasks.push(api("/search?q="+encodeURIComponent(rec)+"&type=video").catch(()=>[]));
const data=await Promise.all(tasks);
results=[...data[1]||[],...data[0]];
}
if(token!==requestId)return;
const seen=new Set();
videos=results.filter(v=>v&&v.videoId&&!seen.has(v.videoId)&&seen.add(v.videoId));
if(cat!=="All"&&!q)videos=videos.filter(v=>videoCategory(v)===cat);
if(!videos.length){status("No videos found. Try another category or search.");return}
renderVideos(videos);
}catch(e){if(token===requestId)status("Couldn't load videos. Check your connection and try again. "+e.message,true)}
}
function thumb(v){return v.videoThumbnails?.find(t=>t.quality==="medium")?.url||v.videoThumbnails?.[0]?.url||"https://i.ytimg.com/vi/"+encodeURIComponent(v.videoId)+"/hqdefault.jpg"}
function avatar(v){return v.authorThumbnails?.[0]?.url||v.authorThumb||"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=50"}
function card(v,small=false){
const el=document.createElement("article");el.className=small?"related":"vc";el.tabIndex=0;
el.innerHTML=`<div class="thumb"><img src="${esc(thumb(v))}" loading="lazy" alt=""></div><div class="${small?"vinfo":"meta"}">${small?"":`<img class="vavatar" src="${esc(avatar(v))}" loading="lazy" alt="">`}<div class="vinfo"><div class="vtitle">${esc(v.title||"Untitled video")}</div><div class="muted">${esc(v.author||"Unknown creator")}</div><div class="muted">${fmtViews(v.viewCount)} · ${fmtAgo(v.published)}</div></div></div>`;
const open=()=>openWatch(v);el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"){open()}};
return el;
}
function renderVideos(list){const grid=$("videoGrid");grid.replaceChildren();list.forEach(v=>grid.appendChild(card(v)))}
function setView(v,push=true,url="/"){
view=v;$("homeView").style.display=v==="home"?"block":"none";$("watchView").style.display=v==="watch"?"block":"none";$("shortsView").style.display=v==="shorts"?"flex":"none";
$("navHome").classList.toggle("active",v==="home");$("navShorts").classList.toggle("active",v==="shorts");
if(push)history.pushState({view:v},"",url);
}
function openWatch(v){
recordWatch(v);watchId=v.videoId;
const url="/watch?v="+encodeURIComponent(watchId);
window.open(url,"_blank","noopener");
}
async function loadWatch(id){
if(!id){setView("home",false);loadVideos();return}
watchId=id;setView("watch",false);
$("watchPlayer").src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0";
$("watchTitle").textContent="Loading video...";
$("watchAuthor").textContent="";
$("watchRelated").replaceChildren();
try{
const v=await (async()=>{const r=await fetch(INVIDIOUS_API+"/videos/"+encodeURIComponent(id));if(!r.ok)throw Error();return r.json()})();
const item={videoId:id,title:v.title||"Video",author:v.author||"",viewCount:v.viewCount||0,published:v.published||0,videoThumbnails:v.videoThumbnails,authorThumbnails:v.authorThumbnails};
$("watchTitle").textContent=item.title;$("watchAuthor").textContent=item.author+" · "+fmtViews(item.viewCount);
recordWatch(item);
}catch{$("watchTitle").textContent="Video";$("watchAuthor").textContent="Playback is provided by YouTube. Video details are unavailable."}
try{const related=await api("/related_streams/"+encodeURIComponent(id));related.slice(0,12).forEach(v=>$("watchRelated").appendChild(card(v,true)))}catch{}
}
async function loadShorts(reset=true){
setView("shorts",false);
if(reset)shortIndex=0;
if(!SHORTS.length){
try{
const d=await api("/trending?region=US");
SHORTS.push(...d.filter(v=>v.videoId&&Number(v.lengthSeconds)>0&&Number(v.lengthSeconds)<=180).map(v=>v.videoId));
}catch{}
if(!SHORTS.length){$("shortStage").innerHTML='<div style="padding:24px;text-align:center;color:#aaa">Shorts are temporarily unavailable.</div>';return}
}
playShort(shortIndex,false);
}
function playShort(i,push=true){
if(!SHORTS.length)return;
shortIndex=(i+SHORTS.length)%SHORTS.length;
const id=SHORTS[shortIndex];
$("shortPlayer").src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0&loop=1&playlist="+encodeURIComponent(id);
if(push)history.pushState({view:"shorts",shortIndex},"","/shorts");
}
function nextShort(dir){playShort(shortIndex+dir)}
function selectCategory(c){query="";$("searchInput").value="";loadVideos("",c);history.pushState({view:"home",category:c},"","/")}
$("searchForm").onsubmit=e=>{e.preventDefault();const q=$("searchInput").value.trim();if(!q)return;loadVideos(q,"All");history.pushState({view:"home",query:q},"","/?q="+encodeURIComponent(q))};
$("navHome").onclick=()=>{query="";$("searchInput").value="";history.pushState({view:"home"},"","/");loadVideos()};
$("homeLogo").onclick=$("navHome").onclick;
$("navShorts").onclick=()=>loadShorts();
$("shortUp").onclick=()=>nextShort(-1);
$("shortDown").onclick=()=>nextShort(1);
$("menuBtn").onclick=()=>document.body.classList.toggle("collapsed");
$("shortStage").addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>20){e.preventDefault();if(!shortBusy){shortBusy=true;nextShort(e.deltaY>0?1:-1);setTimeout(()=>shortBusy=false,450)}}},{passive:false});
let touchY=0;
$("shortStage").addEventListener("touchstart",e=>touchY=e.touches[0].clientY,{passive:true});
$("shortStage").addEventListener("touchend",e=>{const delta=touchY-e.changedTouches[0].clientY;if(Math.abs(delta)>45)nextShort(delta>0?1:-1)},{passive:true});
document.addEventListener("keydown",e=>{if(view==="shorts"&&["ArrowDown","ArrowUp"].includes(e.key)){e.preventDefault();nextShort(e.key==="ArrowDown"?1:-1)}});
window.addEventListener("popstate",route);
function route(){
const path=location.pathname;
if(path==="/watch"||path.endsWith("/watch")){loadWatch(new URLSearchParams(location.search).get("v"));return}
if(path.includes("/shorts")){loadShorts(false);return}
const q=new URLSearchParams(location.search).get("q")||"";
$("searchInput").value=q;loadVideos(q,"All");
}
route();
</script>
</body>
</html>
