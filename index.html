<script>const apiKey='__YOUTUBE_API_KEY__';async function loadVideos(){const grid=document.getElementById('videoGrid');grid.innerHTML='<p style="color:#aaa">Loading vids...</p>';try{const res=await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=20&regionCode=US&key='+apiKey);if(!res.ok)throw new Error('API Error');const data=await res.json();if(data.items&&data.items.length>0){grid.innerHTML='';data.items.forEach(v=>{const id=v.id;const title=v.snippet.title;const chan=v.snippet.channelTitle;const thumb=v.snippet.thumbnails.high?v.snippet.thumbnails.high.url:v.snippet.thumbnails.default.url;const el=document.createElement('div');el.className='vc';el.innerHTML='<div class="vthumb"><img src="'+thumb+'"></div><div class="vtitle">'+title+'</div><div class="vchan">'+chan+'</div>';el.onclick=()=>location.href='https://www.youtube.com/watch?v='+id;grid.appendChild(el);});}else{grid.innerHTML='<p style="color:#ff4444">No videos found.</p>';}}catch(e){grid.innerHTML='<p style="color:#ff4444">Failed to load vids. Check your API key!</p>';}}loadVideos();</script>
