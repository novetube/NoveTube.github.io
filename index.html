<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoveTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ytBlack: '#0f0f0f',
                        ytCard: '#1f1f1f',
                        ytHover: '#272727',
                        ytRed: '#FF0000'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-ytBlack text-white min-h-screen font-sans antialiased flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-ytBlack/95 backdrop-blur border-b border-neutral-800 px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-4 cursor-pointer" onclick="navigateHome()">
            <div class="flex items-center gap-1 text-white font-bold text-lg tracking-tighter">
                <div class="bg-ytRed text-white px-2 py-0.5 rounded-lg flex items-center justify-center text-xs">▶</div>
                <span>NoveTube</span>
            </div>
        </div>

        <!-- Search Bar -->
        <form onsubmit="handleSearch(event)" class="flex items-center w-full max-w-2xl mx-4">
            <div class="flex w-full bg-[#121212] border border-neutral-700 rounded-l-full overflow-hidden focus-within:border-blue-500">
                <input type="text" id="searchInput" placeholder="Search videos or enter channel ID..." 
                    class="w-full bg-transparent px-5 py-2 text-sm text-white focus:outline-none">
            </div>
            <button type="submit" class="bg-neutral-800 border border-l-0 border-neutral-700 px-6 py-2 rounded-r-full hover:bg-neutral-700 transition">
                🔍
            </button>
        </form>

        <div class="w-10"></div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto p-4 md:p-6">
        
        <!-- View 1: Feed & Channel Uploads -->
        <section id="feedView" class="space-y-6">
            <div id="channelHeader" class="hidden bg-ytCard p-6 rounded-2xl border border-neutral-800 flex items-center gap-6">
                <img id="channelAvatar" class="w-20 h-20 rounded-full border-2 border-neutral-700 object-cover" src="" alt="">
                <div class="space-y-1">
                    <h1 id="channelTitle" class="text-2xl font-bold"></h1>
                    <p id="channelStats" class="text-sm text-neutral-300"></p>
                </div>
            </div>

            <h2 id="feedTitle" class="text-xl font-bold text-white tracking-wide">Trending</h2>

            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8">
            </div>
        </section>

        <!-- View 2: Native HTML5 Player Watch View -->
        <section id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <!-- Native Video Player -->
                <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800 flex items-center justify-center">
                    <div id="playerLoading" class="absolute inset-0 bg-black flex flex-col items-center justify-center space-y-3 z-10">
                        <div class="w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
                        <p id="statusMsg" class="text-xs text-neutral-400 font-mono">Resolving direct video stream...</p>
                    </div>
                    <video id="nativePlayer" class="w-full h-full relative z-0" controls autoplay playsinline>
                        Your browser does not support HTML5 video.
                    </video>
                </div>

                <!-- Metadata -->
                <div class="space-y-2">
                    <h1 id="videoTitle" class="text-xl font-bold text-white leading-snug"></h1>
                    <div class="flex items-center justify-between border-b border-neutral-800 pb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center font-bold text-red-500">▶</div>
                            <div>
                                <h3 id="videoChannel" class="font-bold text-sm text-white"></h3>
                                <p id="videoViews" class="text-xs text-neutral-400"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-ytCard p-4 rounded-xl border border-neutral-800 mt-4">
                        <p id="videoDescription" class="text-sm text-neutral-300 whitespace-pre-line leading-relaxed text-xs md:text-sm"></p>
                    </div>
                </div>
            </div>

            <!-- Sidebar Recommendations -->
            <div class="space-y-4">
                <h3 class="font-bold text-base text-neutral-200">Up Next</h3>
                <div id="relatedGrid" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <script>
        // High-availability Invidious API instances
        const INVIDIOUS_INSTANCES = [
            'https://inv.nadeko.net',
            'https://invidious.nerdvpn.de',
            'https://vid.puffyan.us'
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vId = urlParams.get('v');
            const ch = urlParams.get('ch');

            if (vId) {
                watchVideo(vId);
            } else if (ch) {
                loadChannel(ch);
            } else {
                fetchTrendingVideos();
            }
        });

        function navigateHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            
            const player = document.getElementById('nativePlayer');
            player.pause();
            player.src = '';
            
            if (document.getElementById('videoGrid').children.length === 0) {
                fetchTrendingVideos();
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (query.startsWith('UC')) {
                loadChannel(query);
            } else {
                searchVideos(query);
            }
        }

        // Fetch Trending Videos via Invidious API
        async function fetchTrendingVideos() {
            document.getElementById('feedTitle').innerText = 'Trending Videos';
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Loading videos...</div>';

            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/api/v1/trending?region=US`);
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    renderVideoGrid(data.map(item => ({
                        videoId: item.videoId,
                        title: item.title,
                        channelTitle: item.author,
                        channelId: item.authorId,
                        thumbnail: item.videoThumbnails?.find(t => t.quality === 'high']?.url || item.videoThumbnails?.[0]?.url,
                        publishedAt: item.publishedText,
                        views: formatViews(item.viewCount)
                    })));
                    return;
                } catch (e) {
                    console.warn(`Instance ${instance} failed, trying next...`);
                }
            }
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Failed to load content from instances.</div>';
        }

        // Search via Invidious API
        async function searchVideos(query) {
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            document.getElementById('feedTitle').innerText = `Results for "${query}"`;
            
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Searching...</div>';

            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(query)}`);
                    if (!res.ok) continue;
                    const data = await res.json();

                    renderVideoGrid(data.map(item => ({
                        videoId: item.videoId,
                        title: item.title,
                        channelTitle: item.author,
                        channelId: item.authorId,
                        thumbnail: item.videoThumbnails?.find(t => t.quality === 'high']?.url || item.videoThumbnails?.[0]?.url,
                        publishedAt: item.publishedText,
                        views: formatViews(item.viewCount)
                    })));
                    return;
                } catch (e) {}
            }
        }

        // Load Channel Uploads via Invidious API
        async function loadChannel(channelId) {
            window.history.pushState({}, '', `?ch=${channelId}`);
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            
            const player = document.getElementById('nativePlayer');
            player.pause();
            player.src = '';

            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Loading channel...</div>';

            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/api/v1/channels/${channelId}`);
                    if (!res.ok) continue;
                    const ch = await res.json();

                    document.getElementById('channelAvatar').src = ch.authorThumbnails?.[ch.authorThumbnails.length - 1]?.url || '';
                    document.getElementById('channelTitle').innerText = ch.author;
                    document.getElementById('channelStats').innerText = `${formatViews(ch.subCount)} subscribers • ${ch.latestVideos?.length || 0} videos`;
                    document.getElementById('channelHeader').classList.remove('hidden');
                    document.getElementById('feedTitle').innerText = 'Channel Uploads';

                    if (ch.latestVideos) {
                        renderVideoGrid(ch.latestVideos.map(v => ({
                            videoId: v.videoId,
                            title: v.title,
                            channelTitle: ch.author,
                            channelId: ch.authorId,
                            thumbnail: v.videoThumbnails?.[0]?.url,
                            publishedAt: v.publishedText,
                            views: formatViews(v.viewCount)
                        })));
                    }
                    return;
                } catch (e) {}
            }
        }

        // Render Video Grid Cards
        function renderVideoGrid(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'group flex flex-col cursor-pointer space-y-2';
                card.onclick = () => watchVideo(v.videoId);
                card.innerHTML = `
                    <div class="aspect-video w-full bg-neutral-900 rounded-xl overflow-hidden relative border border-neutral-800 group-hover:rounded-none transition-all duration-200">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">
                    </div>
                    <div class="flex gap-3 items-start pt-1">
                        <div class="space-y-1 pr-2">
                            <h3 class="font-semibold text-sm line-clamp-2 text-white group-hover:text-neutral-200 leading-snug">${v.title}</h3>
                            <p class="text-xs text-neutral-400 hover:text-white transition">${v.channelTitle}</p>
                            <p class="text-xs text-neutral-500">${v.views ? v.views + ' views • ' : ''}${v.publishedAt || ''}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Watch Video & Stream Natively via Invidious API JSON
        async function watchVideo(videoId) {
            window.history.pushState({}, '', `?v=${videoId}`);
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('watchView').classList.remove('hidden');

            const loader = document.getElementById('playerLoading');
            const statusMsg = document.getElementById('statusMsg');
            const player = document.getElementById('nativePlayer');
            
            loader.classList.remove('hidden');
            player.pause();
            player.src = '';

            document.getElementById('videoTitle').innerText = 'Loading details...';
            document.getElementById('videoChannel').innerText = '';
            document.getElementById('videoViews').innerText = '';
            document.getElementById('videoDescription').innerText = '';

            // Fetch video stream and metadata
            let streamFound = false;
            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    statusMsg.innerText = `Connecting to ${instance}...`;
                    const res = await fetch(`${instance}/api/v1/videos/${videoId}`);
                    if (!res.ok) continue;
                    const data = await res.json();

                    // Find progressive MP4 stream
                    const stream = data.formatStreams?.find(s => s.container === 'mp4' && s.quality === '720p') 
                                || data.formatStreams?.find(s => s.container === 'mp4');

                    if (stream && stream.url) {
                        player.src = stream.url;
                        player.poster = data.videoThumbnails?.[data.videoThumbnails.length - 1]?.url || '';
                        
                        player.onloadeddata = () => loader.classList.add('hidden');
                        player.play().catch(e => console.log("Autoplay restricted", e));

                        // Populate metadata
                        document.getElementById('videoTitle').innerText = data.title;
                        document.getElementById('videoChannel').innerText = data.author;
                        document.getElementById('videoViews').innerText = `${formatViews(data.viewCount)} views • ${data.publishedText}`;
                        document.getElementById('videoDescription').innerText = data.description;

                        renderSidebarRecommendations(data.recommendedVideos);
                        streamFound = true;
                        break;
                    }
                } catch (e) {}
            }

            if (!streamFound) {
                statusMsg.innerText = "Error: Unable to resolve video stream from active nodes.";
            }
        }

        function renderSidebarRecommendations(videos) {
            const sidebar = document.getElementById('relatedGrid');
            sidebar.innerHTML = '';
            if (!videos) return;

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'flex gap-2 cursor-pointer group hover:bg-ytHover p-1.5 rounded-lg transition';
                card.onclick = () => watchVideo(v.videoId);
                card.innerHTML = `
                    <div class="w-40 aspect-video bg-neutral-900 rounded-lg overflow-hidden flex-shrink-0 relative">
                        <img src="${v.videoThumbnails?.[0]?.url}" class="w-full h-full object-cover" alt="">
                    </div>
                    <div class="space-y-1">
                        <h4 class="text-xs font-semibold text-white line-clamp-2 leading-tight group-hover:text-neutral-200">${v.title}</h4>
                        <p class="text-[11px] text-neutral-400">${v.author}</p>
                        <p class="text-[10px] text-neutral-500">${formatViews(v.viewCount)} views</p>
                    </div>
                `;
                sidebar.appendChild(card);
            });
        }

        function formatViews(num) {
            if (!num) return '0';
            num = parseInt(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString();
        }
    </script>
</body>
</html>
