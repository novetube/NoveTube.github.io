<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NoveTube</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{ytBlack:"#0f0f0f",ytCard:"#1f1f1f",ytRed:"#ff0000"}}}};</script>
</head>
<body class="bg-ytBlack text-white min-h-screen flex flex-col font-sans">
<header class="sticky top-0 z-50 bg-ytBlack/95 border-b border-neutral-800 px-4 h-14 flex items-center justify-between gap-4">
<button id="homeButton" class="flex items-center gap-2 shrink-0"><span class="bg-ytRed text-white px-2 py-1 rounded text-xs font-bold">▶</span><span class="font-bold text-lg">NoveTube</span></button>
<form id="searchForm" class="flex items-center w-full max-w-2xl"><input id="searchInput" type="search" placeholder="Search videos..." class="w-full bg-[#121212] border border-neutral-700 rounded-l-full px-5 py-2 text-sm focus:outline-none"><button class="bg-neutral-800 border border-l-0 border-neutral-700 px-5 py-2 rounded-r-full hover:bg-neutral-700">⌕</button></form>
</header>
<main class="flex-1 max-w-[1800px] w-full mx-auto p-6">
<section id="feedView" class="space-y-6"><h2 id="feedTitle" class="text-xl font-bold">Trending</h2><div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div></section>
<section id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 space-y-4">
<div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-neutral-800"><iframe id="privacyPlayer" class="w-full h-full border-0" allowfullscreen></iframe></div>
<h1 id="videoTitle" class="text-xl font-bold">Loading...</h1>
</div>
</section>
</main>
<script>
"use strict";
const API_KEY="__YOUTUBE_API_KEY__",API_BASE="https://www.googleapis.com/youtube/v3",$ = id=>document.getElementById(id);
async function apiReq(e,p={}){if(!API_KEY||API_KEY==="__YOUTUBE_API_KEY__")throw new Error("Missing API Key");const u=new URL(`${API_BASE}/${e}`);Object.entries({...p,key:API_KEY}).forEach(([k,v])=>v&&u.searchParams.set(k,v));const r=await fetch(u),d=await r.json();if(!r.ok||d.error)throw new Error(d?.error?.message||"Error");return d;}
function render(videos){const g=$("videoGrid");g.innerHTML="";videos.forEach(v=>{const d=document.createElement("div");d.className="cursor-pointer space-y-2";d.innerHTML=`<div class="aspect-video bg-neutral-800 rounded-xl overflow-hidden"><img src="${v.thumb}" class="w-full h-full object-cover"></div><h3 class="font-semibold text-sm line-clamp-2">${v.title}</h3><p class="text-xs text-neutral-400">${v.channel}</p>`;d.onclick=()=>play(v.id,v.title);g.appendChild(d);});}
async function loadTrending(){$("watchView").classList.add("hidden");$("feedView").classList.remove("hidden");$("videoGrid").innerHTML="Loading...";try{const d=await apiReq("videos",{part:"snippet",chart:"mostPopular",maxResults:24,regionCode:"US"});render((d.items\vert{}\vert{}[]).map(i=>({id:i.id,title:i.snippet.title,channel:i.snippet.channelTitle,thumb:i.snippet.thumbnails?.high?.url})));}catch(e){$("videoGrid").innerHTML=e.message;}}
function play(id,title){$("feedView").classList.add("hidden");$("watchView").classList.remove("hidden");$("videoTitle").textContent=title\vert{}\vert{}"";$("privacyPlayer").src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;}
$("homeButton").onclick=loadTrending;
$("searchForm").onsubmit=async e=>{e.preventDefault();const q=$("searchInput").value.trim();if(!q)return;$("watchView").classList.add("hidden");$("feedView").classList.remove("hidden");$("videoGrid").innerHTML="Searching...";try{const d=await apiReq("search",{part:"snippet",type:"video",maxResults:24,q:q});render((d.items\vert{}\vert{}[]).map(i=>({id:i.id.videoId,title:i.snippet.title,channel:i.snippet.channelTitle,thumb:i.snippet.thumbnails?.high?.url})));}catch(e){$("videoGrid").innerHTML=e.message;}};
loadTrending();
</script>
</body>
</html>
