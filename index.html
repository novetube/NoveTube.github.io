<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><style>*,::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0f0f;--bg2:#212121;--bg3:#272727;--text:#f1f1f1;--text2:#aaa;--border:#3f3f3f;--red:#ff0000}html,body{background:var(--bg);color:var(--text);font-family:sans-serif;font-size:14px;min-height:100vh}body{display:flex;flex-direction:column}header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);z-index:200}.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:20px}.logo-mark{width:34px;height:24px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center}#main{margin-top:56px;padding:24px;flex:1}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.vc{cursor:pointer}.vthumb{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}.vthumb img{width:100%;height:100%}.vtitle{font-weight:500;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vchan,.vstats{font-size:12px;color:var(--text2)}</style></head><body><header><div class="logo"><div class="logo-mark">▶</div>NoveTube</div></header><main id="main"><div id="videoGrid"></div></main><script>const apis=['[https://pipedapi.kavin.rocks](https://pipedapi.kavin.rocks)','[https://pipedapi.privacydev.net](https://pipedapi.privacydev.net)','[https://pipedapi.tokhmi.xyz](https://pipedapi.tokhmi.xyz)'];async function loadVideos(){const grid=document.getElementById('videoGrid');grid.innerHTML='<p>Loading vids...</p>';for(const api of apis){try{const res=await fetch(api+'/trending/US');if(res.ok){const data=await res.json();if(data&&data.length>0){grid.innerHTML='';data.forEach(v=>{const id=v.url.split('/watch?v=')[1]||'';const el=document.createElement('div');el.className='vc';el.innerHTML='<div class="vthumb"><img src="'+(v.thumbnail||'')+'"></div><div class="vtitle">'+(v.title||'')+'</div><div class="vchan">'+(v.uploader||'')+'</div>';grid.appendChild(el);});return;}}}catch(e){}}grid.innerHTML='<p style="color:red">Failed to load vids. Try refreshing!</p>';}loadVideos();</script></body></html>
