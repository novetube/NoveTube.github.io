<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoveTube</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f0f0f',
                        cardbg: '#212121',
                        hoverbg: '#3f3f3f'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white min-h-screen font-sans selection:bg-red-600 selection:text-white">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-darkbg/95 backdrop-blur border-b border-neutral-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">
            <span class="text-xl font-bold tracking-tighter text-red-600 flex items-center gap-1">
                ▶ NoveTube
            </span>
        </div>
        
        <!-- Search Form -->
        <form onsubmit="handleSearch(event)" class="flex items-center w-full max-w-xl mx-4">
            <div class="flex w-full bg-neutral-900 border border-neutral-700 rounded-l-full overflow-hidden focus-within:border-blue-500">
                <input type="text" id="searchInput" placeholder="Search videos or enter @channel..." 
                    class="w-full bg-transparent px-5 py-2 text-sm text-white focus:outline-none">
            </div>
            <button type="submit" class="bg-neutral-800 border border-l-0 border-neutral-700 px-6 py-2 rounded-r-full hover:bg-neutral-700 transition">
                🔍
            </button>
        </form>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- View 1: Home / Search Results / Channel Uploads Grid -->
        <section id="homeView" class="space-y-6">
            <div id="channelHeader" class="hidden flex items-center gap-4 bg-cardbg p-4 rounded-xl border border-neutral-800">
                <img id="channelAvatar" class="w-16 h-16 rounded-full object-cover" src="" alt="">
                <div>
                    <h2 id="channelTitle" class="text-xl font-bold"></h2>
                    <p id="channelStats" class="text-sm text-neutral-400"></p>
                </div>
            </div>
            <h2 id="sectionTitle" class="text-lg font-semibold text-neutral-200">Recommended / Search Results</h2>
            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Dynamic video cards go here -->
            </div>
        </section>

        <!-- View 2: Native Player View (No iFrames) -->
        <section id="playerView" class="hidden space-y-4 max-w-5xl mx-auto">
            <button onclick="navigateHome()" class="text-sm text-neutral-400 hover:text-white flex items-center gap-1">
                ← Back to results
            </button>
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-neutral-800">
                <!-- Native HTML5 Video Player -->
                <video id="nativePlayer" class="w-full h-full" controls autoplay playsinline poster="">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div>
                <h1 id="playerTitle" class="text-xl font-bold text-white"></h1>
                <p id="playerChannel" class="text-sm text-neutral-400 mt-1 cursor-pointer hover:underline" onclick="loadChannel(currentChannelId)"></p>
                <p id="playerDescription" class="text-sm text-neutral-300 mt-4 bg-cardbg p-4 rounded-xl border border-neutral-800 whitespace-pre-line"></p>
            </div>
        </section>

    </main>

    <!-- Application Script -->
    <script>
        // Secret placeholder injected securely during GitHub Actions build pipeline
        const API_KEY = '__YOUTUBE_API_KEY__';

        let currentChannelId = '';

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vId = urlParams.get('v');
            const ch = urlParams.get('ch');

            if (vId) {
                playVideo(vId);
            } else if (ch) {
                loadChannel(ch);
            } else {
                fetchTrendingVideos();
            }
        });

        function navigateHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('playerView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            if (!document.getElementById('videoGrid').hasChildNodes()) {
                fetchTrendingVideos();
            }
        }

        // Handle Search Submit
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (query.startsWith('@') || query.startsWith('UC')) {
                loadChannel(query);
            } else {
                searchVideos(query);
            }
        }

        // Search YouTube Data API v3
        async function searchVideos(query) {
            document.getElementById('playerView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            document.getElementById('sectionTitle').innerText = `Search Results for "${query}"`;
            
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-500">Searching YouTube...</div>';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=16&q=${encodeURIComponent(query)}&key=${API_KEY}`);
                const data = await res.json();
                
                if (data.items) {
                    renderVideoGrid(data.items.map(item => ({
                        videoId: item.id.videoId,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: item.snippet.channelId,
                        thumbnail: item.snippet.thumbnails.high.url
                    })));
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-500">No results found.</div>';
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Failed to fetch search results.</div>';
            }
        }

        // Fetch Trending / Default Videos
        async function fetchTrendingVideos() {
            document.getElementById('sectionTitle').innerText = 'Trending Videos';
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-500">Loading videos...</div>';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=16&regionCode=US&key=${API_KEY}`);
                const data = await res.json();

                if (data.items) {
                    renderVideoGrid(data.items.map(item => ({
                        videoId: item.id,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: item.snippet.channelId,
                        thumbnail: item.snippet.thumbnails.high.url
                    })));
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-500">No trending videos available.</div>';
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Failed to load content.</div>';
            }
        }

        // Load Channel Info & Uploads Playlist
        async function loadChannel(channelIdentifier) {
            document.getElementById('playerView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-500">Loading channel...</div>';

            try {
                let url = channelIdentifier.startsWith('UC') 
                    ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails,statistics&id=${channelIdentifier}&key=${API_KEY}`
                    : `https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails,statistics&forHandle=${encodeURIComponent(channelIdentifier)}&key=${API_KEY}`;

                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-neutral-400">Channel not found.</div>';
                    return;
                }

                const ch = data.items[0];
                currentChannelId = ch.id;

                // Render channel profile header
                document.getElementById('channelAvatar').src = ch.snippet.thumbnails.default.url;
                document.getElementById('channelTitle').innerText = ch.snippet.title;
                document.getElementById('channelStats').innerText = `${Number(ch.statistics.subscriberCount).toLocaleString()} subscribers • ${Number(ch.statistics.videoCount).toLocaleString()} videos`;
                document.getElementById('channelHeader').classList.remove('hidden');
                document.getElementById('sectionTitle').innerText = 'Channel Uploads';

                // Fetch channel upload items from contentDetails playlist
                const uploadsId = ch.contentDetails.relatedPlaylists.uploads;
                const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=20&playlistId=${uploadsId}&key=${API_KEY}`);
                const plData = await plRes.json();

                if (plData.items) {
                    renderVideoGrid(plData.items.map(item => ({
                        videoId: item.snippet.resourceId.videoId,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: ch.id,
                        thumbnail: item.snippet.thumbnails.high.url
                    })));
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Failed to load channel data.</div>';
            }
        }

        // Render Video Cards Grid
        function renderVideoGrid(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'bg-cardbg rounded-xl overflow-hidden border border-neutral-800 hover:border-neutral-700 transition cursor-pointer flex flex-col';
                card.onclick = () => playVideo(v.videoId);
                card.innerHTML = `
                    <div class="aspect-video w-full bg-neutral-900 overflow-hidden relative">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover hover:scale-105 transition duration-300" alt="${v.title}">
                    </div>
                    <div class="p-3 flex flex-col flex-grow">
                        <h3 class="font-semibold text-sm line-clamp-2 text-white">${v.title}</h3>
                        <p class="text-xs text-neutral-400 mt-2 hover:text-white" onclick="event.stopPropagation(); loadChannel('${v.channelId}')">${v.channelTitle}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Native HTML5 Video Stream Player (No YouTube iFrames)
        async function playVideo(videoId) {
            window.history.pushState({}, '', `?v=${videoId}`);
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('playerView').classList.remove('hidden');

            const videoElement = document.getElementById('nativePlayer');
            videoElement.src = '';
            document.getElementById('playerTitle').innerText = 'Loading direct stream...';
            document.getElementById('playerChannel').innerText = '';
            document.getElementById('playerDescription').innerText = '';

            // Fetch video metadata via YouTube API
            try {
                const metaRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${API_KEY}`);
                const metaData = await metaRes.json();
                if (metaData.items && metaData.items.length > 0) {
                    const snippet = metaData.items[0].snippet;
                    document.getElementById('playerTitle').innerText = snippet.title;
                    document.getElementById('playerChannel').innerText = snippet.channelTitle;
                    document.getElementById('playerChannel').onclick = () => loadChannel(snippet.channelId);
                    document.getElementById('playerDescription').innerText = snippet.description;
                    videoElement.poster = snippet.thumbnails.high.url;
                }
            } catch (e) {
                console.error("Failed to load metadata", e);
            }

            // Extract stream URL via Invidious public instances fallback rotation
            const instances = [
                'https://vid.puffyan.us',
                'https://invidious.nerqv.de',
                'https://inv.api.store'
            ];

            let streamUrl = null;
            for (const instance of instances) {
                try {
                    const res = await fetch(`${instance}/api/v1/videos/${videoId}`);
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    const format = data.formatStreams.find(f => f.container === 'mp4' && f.qualityLabel === '720p')
                                || data.formatStreams.find(f => f.container === 'mp4');
                    
                    if (format && format.url) {
                        streamUrl = format.url;
                        break;
                    }
                } catch (err) {
                    console.warn(`Instance ${instance} failed, trying next...`);
                }
            }

            if (streamUrl) {
                videoElement.src = streamUrl;
                videoElement.play().catch(err => console.log("Autoplay blocked:", err));
            } else {
                document.getElementById('playerTitle').innerText += ' (Direct stream format unavailable)';
            }
        }
    </script>
</body>
</html>
