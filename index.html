<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoveTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ytBlack: '#0f0f0f',
                        ytCard: '#1f1f1f',
                        ytHover: '#272727',
                        ytRed: '#FF0000'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-ytBlack text-white min-h-screen font-sans antialiased flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-ytBlack/95 backdrop-blur border-b border-neutral-800 px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-4 cursor-pointer" onclick="navigateHome()">
            <div class="flex items-center gap-1 text-white font-bold text-lg tracking-tighter">
                <div class="bg-ytRed text-white px-2 py-0.5 rounded-lg flex items-center justify-center text-xs">▶</div>
                <span>NoveTube</span>
            </div>
        </div>

        <!-- Search Bar -->
        <form onsubmit="handleSearch(event)" class="flex items-center w-full max-w-2xl mx-4">
            <div class="flex w-full bg-[#121212] border border-neutral-700 rounded-l-full overflow-hidden focus-within:border-blue-500">
                <input type="text" id="searchInput" placeholder="Search videos or enter @channel..." 
                    class="w-full bg-transparent px-5 py-2 text-sm text-white focus:outline-none">
            </div>
            <button type="submit" class="bg-neutral-800 border border-l-0 border-neutral-700 px-6 py-2 rounded-r-full hover:bg-neutral-700 transition">
                🔍
            </button>
        </form>

        <div class="w-10"></div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto p-4 md:p-6">
        
        <!-- View 1: Feed & Channel Uploads -->
        <section id="feedView" class="space-y-6">
            <div id="channelHeader" class="hidden bg-ytCard p-6 rounded-2xl border border-neutral-800 flex items-center gap-6">
                <img id="channelAvatar" class="w-20 h-20 rounded-full border-2 border-neutral-700 object-cover" src="" alt="">
                <div class="space-y-1">
                    <h1 id="channelTitle" class="text-2xl font-bold"></h1>
                    <p id="channelHandle" class="text-xs text-neutral-400 font-mono"></p>
                    <p id="channelStats" class="text-sm text-neutral-300"></p>
                </div>
            </div>

            <h2 id="feedTitle" class="text-xl font-bold text-white tracking-wide">Trending</h2>

            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8">
            </div>
        </section>

        <!-- View 2: Watch View -->
        <section id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <!-- Privacy Embed Player Box -->
                <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800">
                    <iframe id="privacyPlayer" class="w-full h-full border-0" allowfullscreen 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                    </iframe>
                </div>

                <!-- Metadata -->
                <div class="space-y-2">
                    <h1 id="videoTitle" class="text-xl font-bold text-white leading-snug"></h1>
                    <div class="flex items-center justify-between border-b border-neutral-800 pb-4">
                        <div id="authorBox" class="flex items-center gap-3 cursor-pointer group" onclick="loadChannel(currentChannelId)">
                            <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center font-bold text-red-500">▶</div>
                            <div>
                                <h3 id="videoChannel" class="font-bold text-sm text-white group-hover:underline"></h3>
                                <p id="videoViews" class="text-xs text-neutral-400"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-ytCard p-4 rounded-xl border border-neutral-800 mt-4">
                        <p id="videoDescription" class="text-sm text-neutral-300 whitespace-pre-line leading-relaxed text-xs md:text-sm"></p>
                    </div>
                </div>
            </div>

            <!-- Sidebar Recommendations -->
            <div class="space-y-4">
                <h3 class="font-bold text-base text-neutral-200">Up Next</h3>
                <div id="relatedGrid" class="space-y-3"></div>
            </div>
        </section>
    </main>

    <script>
        // Secret placeholder securely injected by GitHub Actions build pipeline
        const API_KEY = '__YOUTUBE_API_KEY__';

        let currentChannelId = '';

        // Privacy embed endpoints (ad-free & tracking-free)
        const EMBED_INSTANCES = [
            id => `https://piped.video/embed/${id}?autoplay=1`,
            id => `https://vid.puffyan.us/embed/${id}?autoplay=1`
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vId = urlParams.get('v');
            const ch = urlParams.get('ch');

            if (vId) {
                watchVideo(vId);
            } else if (ch) {
                loadChannel(ch);
            } else {
                fetchTrendingVideos();
            }
        });

        function navigateHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            document.getElementById('privacyPlayer').src = '';
            
            if (document.getElementById('videoGrid').children.length === 0) {
                fetchTrendingVideos();
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (query.startsWith('@') || query.startsWith('UC')) {
                loadChannel(query);
            } else {
                searchVideos(query);
            }
        }

        // Fetch Trending Videos via YouTube Data API v3
        async function fetchTrendingVideos() {
            document.getElementById('feedTitle').innerText = 'Trending Videos';
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Loading videos...</div>';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=24&regionCode=US&key=${API_KEY}`);
                const data = await res.json();

                if (data.items) {
                    renderVideoGrid(data.items.map(item => ({
                        videoId: item.id,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: item.snippet.channelId,
                        thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url,
                        publishedAt: formatDate(item.snippet.publishedAt),
                        views: item.statistics?.viewCount ? formatViews(item.statistics.viewCount) : ''
                    })));
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">API quota or key error.</div>';
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Failed to load content.</div>';
            }
        }

        // Search via YouTube Data API v3
        async function searchVideos(query) {
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            document.getElementById('channelHeader').classList.add('hidden');
            document.getElementById('feedTitle').innerText = `Results for "${query}"`;
            
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Searching YouTube...</div>';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=24&q=${encodeURIComponent(query)}&key=${API_KEY}`);
                const data = await res.json();
                
                if (data.items) {
                    renderVideoGrid(data.items.map(item => ({
                        videoId: item.id.videoId,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: item.snippet.channelId,
                        thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url,
                        publishedAt: formatDate(item.snippet.publishedAt),
                        views: ''
                    })));
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Search request failed.</div>';
            }
        }

        // Load Channel & Uploads Playlist via YouTube Data API v3
        async function loadChannel(channelIdentifier) {
            window.history.pushState({}, '', `?ch=${channelIdentifier}`);
            document.getElementById('watchView').classList.add('hidden');
            document.getElementById('feedView').classList.remove('hidden');
            document.getElementById('privacyPlayer').src = '';

            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-500">Loading channel...</div>';

            try {
                let url = channelIdentifier.startsWith('UC') 
                    ? `https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails,statistics&id=${channelIdentifier}&key=${API_KEY}`
                    : `https://www.googleapis.com/youtube/v3/channels?part=snippet,contentDetails,statistics&forHandle=${encodeURIComponent(channelIdentifier)}&key=${API_KEY}`;

                const res = await fetch(url);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-20 text-neutral-400">Channel not found.</div>';
                    return;
                }

                const ch = data.items[0];
                currentChannelId = ch.id;

                document.getElementById('channelAvatar').src = ch.snippet.thumbnails.default.url;
                document.getElementById('channelTitle').innerText = ch.snippet.title;
                document.getElementById('channelHandle').innerText = ch.snippet.customUrl || '';
                document.getElementById('channelStats').innerText = `${formatViews(ch.statistics.subscriberCount)} subscribers • ${formatViews(ch.statistics.videoCount)} videos`;
                document.getElementById('channelHeader').classList.remove('hidden');
                document.getElementById('feedTitle').innerText = 'Uploads';

                const uploadsPlaylistId = ch.contentDetails.relatedPlaylists.uploads;
                const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=24&playlistId=${uploadsPlaylistId}&key=${API_KEY}`);
                const plData = await plRes.json();

                if (plData.items) {
                    renderVideoGrid(plData.items.map(item => ({
                        videoId: item.snippet.resourceId.videoId,
                        title: item.snippet.title,
                        channelTitle: item.snippet.channelTitle,
                        channelId: ch.id,
                        thumbnail: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url,
                        publishedAt: formatDate(item.snippet.publishedAt),
                        views: ''
                    })));
                }
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-red-500">Failed to load channel data.</div>';
            }
        }

        // Render Video Grid Cards
        function renderVideoGrid(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'group flex flex-col cursor-pointer space-y-2';
                card.onclick = () => watchVideo(v.videoId);
                card.innerHTML = `
                    <div class="aspect-video w-full bg-neutral-900 rounded-xl overflow-hidden relative border border-neutral-800 group-hover:rounded-none transition-all duration-200">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">
                    </div>
                    <div class="flex gap-3 items-start pt-1">
                        <div class="space-y-1 pr-2">
                            <h3 class="font-semibold text-sm line-clamp-2 text-white group-hover:text-neutral-200 leading-snug">${v.title}</h3>
                            <p class="text-xs text-neutral-400 hover:text-white transition" onclick="event.stopPropagation(); loadChannel('${v.channelId}')">${v.channelTitle}</p>
                            <p class="text-xs text-neutral-500">${v.views ? v.views + ' views • ' : ''}${v.publishedAt}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Watch Video with Privacy Embed & Metadata
        async function watchVideo(videoId) {
            window.history.pushState({}, '', `?v=${videoId}`);
            document.getElementById('feedView').classList.add('hidden');
            document.getElementById('watchView').classList.remove('hidden');

            const iframe = document.getElementById('privacyPlayer');
            iframe.src = EMBED_INSTANCES[0](videoId);

            document.getElementById('videoTitle').innerText = 'Loading details...';
            document.getElementById('videoChannel').innerText = '';
            document.getElementById('videoViews').innerText = '';
            document.getElementById('videoDescription').innerText = '';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoId}&key=${API_KEY}`);
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    const snippet = data.items[0].snippet;
                    const stats = data.items[0].statistics;

                    currentChannelId = snippet.channelId;
                    document.getElementById('videoTitle').innerText = snippet.title;
                    document.getElementById('videoChannel').innerText = snippet.channelTitle;
                    document.getElementById('videoViews').innerText = `${formatViews(stats.viewCount)} views • ${formatDate(snippet.publishedAt)}`;
                    document.getElementById('videoDescription').innerText = snippet.description;

                    fetchRelatedVideos(snippet.categoryId || '');
                }
            } catch (err) {
                console.error("Failed to load video details", err);
            }
        }

        // Fetch Sidebar Recommendations
        async function fetchRelatedVideos(categoryId) {
            const sidebar = document.getElementById('relatedGrid');
            sidebar.innerHTML = '<div class="text-xs text-neutral-500">Loading recommendations...</div>';

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&videoCategoryId=${categoryId}&maxResults=8&key=${API_KEY}`);
                const data = await res.json();

                if (data.items) {
                    sidebar.innerHTML = '';
                    data.items.forEach(v => {
                        const card = document.createElement('div');
                        card.className = 'flex gap-2 cursor-pointer group hover:bg-ytHover p-1.5 rounded-lg transition';
                        card.onclick = () => watchVideo(v.id);
                        card.innerHTML = `
                            <div class="w-40 aspect-video bg-neutral-900 rounded-lg overflow-hidden flex-shrink-0 relative">
                                <img src="${v.snippet.thumbnails.medium?.url}" class="w-full h-full object-cover" alt="">
                            </div>
                            <div class="space-y-1">
                                <h4 class="text-xs font-semibold text-white line-clamp-2 leading-tight group-hover:text-neutral-200">${v.snippet.title}</h4>
                                <p class="text-[11px] text-neutral-400">${v.snippet.channelTitle}</p>
                                <p class="text-[10px] text-neutral-500">${formatViews(v.statistics?.viewCount || 0)} views</p>
                            </div>
                        `;
                        sidebar.appendChild(card);
                    });
                }
            } catch (e) {
                sidebar.innerHTML = '';
            }
        }

        function formatViews(num) {
            if (!num) return '0';
            num = parseInt(num);
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString();
        }

        function formatDate(isoStr) {
            if (!isoStr) return '';
            const date = new Date(isoStr);
            return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
