
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NoveTube</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        ytBlack: "#0f0f0f",
        ytCard: "#1f1f1f",
        ytHover: "#272727",
        ytRed: "#ff0000"
      }
    }
  }
};
</script>
<style>
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#0f0f0f}
::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#555}
button:focus-visible,input:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-ytBlack text-white min-h-screen font-sans antialiased flex flex-col">

<header class="sticky top-0 z-50 bg-ytBlack/95 backdrop-blur border-b border-neutral-800 px-4 h-14 flex items-center justify-between gap-4">
  <button id="homeButton" class="flex items-center gap-2 shrink-0" aria-label="NoveTube home">
    <span class="bg-ytRed px-2 py-1 rounded-lg text-xs">▶</span>
    <span class="font-bold text-lg tracking-tight">NoveTube</span>
  </button>
  <form id="searchForm" class="flex items-center w-full max-w-2xl">
    <input id="searchInput" type="search" maxlength="200" placeholder="Search videos or enter @channel..." class="min-w-0 w-full bg-[#121212] border border-neutral-700 rounded-l-full px-5 py-2 text-sm focus:outline-none focus:border-blue-500">
    <button class="bg-neutral-800 border border-l-0 border-neutral-700 px-5 py-2 rounded-r-full hover:bg-neutral-700" aria-label="Search">⌕</button>
  </form>
</header>

<main class="flex-1 max-w-[1800px] w-full mx-auto p-4 md:p-6">
  <section id="feedView" class="space-y-6">
    <div id="channelHeader" class="hidden bg-ytCard p-6 rounded-2xl border border-neutral-800 items-center gap-5">
      <img id="channelAvatar" class="w-20 h-20 rounded-full border border-neutral-700 object-cover" alt="Channel avatar">
      <div class="space-y-1 min-w-0">
        <h1 id="channelTitle" class="text-2xl font-bold"></h1>
        <p id="channelHandle" class="text-xs text-neutral-400"></p>
        <p id="channelStats" class="text-sm text-neutral-300"></p>
      </div>
    </div>
    <h2 id="feedTitle" class="text-xl font-bold">Trending</h2>
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-8"></div>
  </section>

  <section id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-4 min-w-0">
      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-neutral-800">
        <iframe id="privacyPlayer" class="w-full h-full border-0" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <div class="flex flex-wrap gap-2">
        <button data-player="youtube" class="playerButton bg-neutral-800 hover:bg-neutral-700 px-3 py-2 rounded-full text-xs">YouTube player</button>
        <button data-player="piped" class="playerButton bg-neutral-800 hover:bg-neutral-700 px-3 py-2 rounded-full text-xs">Piped player</button>
        <button data-player="puffyan" class="playerButton bg-neutral-800 hover:bg-neutral-700 px-3 py-2 rounded-full text-xs">Alternative player</button>
      </div>
      <div class="space-y-3">
        <h1 id="videoTitle" class="text-xl font-bold break-words">Loading video...</h1>
        <button id="authorBox" class="flex items-center gap-3 text-left group">
          <span class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center text-red-500">▶</span>
          <span>
            <span id="videoChannel" class="block font-bold text-sm group-hover:underline"></span>
            <span id="videoViews" class="block text-xs text-neutral-400"></span>
          </span>
        </button>
        <div class="bg-ytCard p-4 rounded-xl border border-neutral-800">
          <p id="videoDescription" class="text-sm text-neutral-300 whitespace-pre-line break-words"></p>
        </div>
      </div>
    </div>
    <aside class="space-y-4 min-w-0">
      <h2 class="font-bold">More videos</h2>
      <div id="relatedGrid" class="space-y-3"></div>
    </aside>
  </section>
</main>

<script>
"use strict";

// Replaced during GitHub Actions deployment.
const API_KEY = "__YOUTUBE_API_KEY__";
const API_BASE = "https://www.googleapis.com/youtube/v3";

let currentChannelId = "";
let currentVideoId = "";
let currentPlayer = "youtube";
let requestVersion = 0;

const $ = id => document.getElementById(id);

function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function showMessage(container, message, error = false) {
  container.replaceChildren(
    make("p", `col-span-full text-center py-12 ${error ? "text-red-400" : "text-neutral-400"}`, message)
  );
}

function formatViews(value) {
  if (value === undefined || value === null || value === "") return "Hidden";
  const n = Number(value);
  if (!Number.isFinite(n)) return "Hidden";
  return new Intl.NumberFormat(undefined, {
    notation: n >= 1000 ? "compact" : "standard",
    maximumFractionDigits: 1
  }).format(n);
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "" :
    date.toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"});
}

function apiError(data, status) {
  const reason = data?.error?.errors?.[0]?.reason;
  if (reason === "quotaExceeded" || reason === "dailyLimitExceeded") {
    return "YouTube API quota exceeded. Try again after the quota resets.";
  }
  if (reason === "keyInvalid" || reason === "accessNotConfigured") {
    return "The YouTube API key is invalid or the YouTube Data API v3 is not enabled.";
  }
  if (status === 403) return "YouTube denied this request. Check your API key restrictions and quota.";
  if (status === 400) return "YouTube rejected the request. Check the search or channel details.";
  return data?.error?.message || `YouTube API request failed (${status}).`;
}

async function apiRequest(endpoint, params = {}) {
  if (!API_KEY || API_KEY === "__YOUTUBE_API_KEY__") {
    throw new Error("The API key was not injected. Check the YOUTUBE_API_KEY GitHub Actions secret.");
  }

  const url = new URL(`${API_BASE}/${endpoint}`);
  for (const [key, value] of Object.entries({...params, key:API_KEY})) {
    if (value !== undefined && value !== null && value !== "") {
      url.searchParams.set(key, value);
    }
  }

  const response = await fetch(url);
  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error("YouTube returned an unreadable response.");
  }

  if (!response.ok || data.error) {
    throw new Error(apiError(data, response.status));
  }

  return data;
}

function videoObject(item, source = "video") {
  const snippet = item.snippet || {};
  const id = source === "search" ? item.id?.videoId :
    source === "playlist" ? snippet.resourceId?.videoId : item.id;

  if (!id) return null;

  return {
    videoId: id,
    title: snippet.title || "Untitled video",
    channelTitle: snippet.channelTitle || "Unknown channel",
    channelId: snippet.channelId || "",
    thumbnail: snippet.thumbnails?.high?.url ||
      snippet.thumbnails?.medium?.url ||
      snippet.thumbnails?.default?.url || "",
    publishedAt: formatDate(snippet.publishedAt),
    views: item.statistics?.viewCount
  };
}

function createVideoCard(video) {
  const card = make("article", "group min-w-0 cursor-pointer space-y-2");
  card.tabIndex = 0;
  card.setAttribute("role", "link");
  card.setAttribute("aria-label", `Watch ${video.title}`);

  const thumbnailBox = make("div", "aspect-video w-full bg-neutral-900 rounded-xl overflow-hidden border border-neutral-800 group-hover:rounded-lg");
  if (video.thumbnail) {
    const img = make("img", "w-full h-full object-cover group-hover:scale-105 transition duration-200");
    img.src = video.thumbnail;
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    thumbnailBox.append(img);
  }

  const details = make("div", "space-y-1");
  details.append(make("h3", "font-semibold text-sm line-clamp-2 leading-snug", video.title));

  const channel = make("button", "block text-xs text-neutral-400 hover:text-white text-left");
  channel.textContent = video.channelTitle;
  channel.addEventListener("click", event => {
    event.stopPropagation();
    if (video.channelId) loadChannel(video.channelId);
  });

  const stats = [];
  if (video.views !== undefined) stats.push(`${formatViews(video.views)} views`);
  if (video.publishedAt) stats.push(video.publishedAt);
  details.append(channel, make("p", "text-xs text-neutral-500", stats.join(" • ")));
  card.append(thumbnailBox, details);

  card.addEventListener("click", () => watchVideo(video.videoId));
  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      watchVideo(video.videoId);
    }
  });

  return card;
}

function renderVideoGrid(videos) {
  const grid = $("videoGrid");
  grid.replaceChildren();

  if (!videos.length) {
    showMessage(grid, "No videos found.");
    return;
  }

  const fragment = document.createDocumentFragment();
  videos.forEach(video => fragment.append(createVideoCard(video)));
  grid.append(fragment);
}

function setFeed(title) {
  $("watchView").classList.add("hidden");
  $("feedView").classList.remove("hidden");
  $("channelHeader").classList.add("hidden");
  $("feedTitle").textContent = title;
  $("privacyPlayer").src = "";
  currentVideoId = "";
}

function setPlayer(videoId, provider = "youtube") {
  const providers = {
    youtube: id => `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1`,
    piped: id => `https://piped.video/embed/${encodeURIComponent(id)}?autoplay=1`,
    puffyan: id => `https://vid.puffyan.us/embed/${encodeURIComponent(id)}?autoplay=1`
  };

  if (!providers[provider]) provider = "youtube";
  currentPlayer = provider;
  $("privacyPlayer").src = providers[provider](videoId);
}

async function fetchTrendingVideos() {
  const version = ++requestVersion;
  setFeed("Trending videos");
  showMessage($("videoGrid"), "Loading trending videos...");

  try {
    const data = await apiRequest("videos", {
      part:"snippet,statistics",
      chart:"mostPopular",
      maxResults:24,
      regionCode:"IE"
    });
    if (version !== requestVersion) return;
    renderVideoGrid((data.items || []).map(item => videoObject(item)).filter(Boolean));
  } catch (error) {
    if (version !== requestVersion) return;
    showMessage($("videoGrid"), error.message, true);
  }
}

async function searchVideos(query) {
  const version = ++requestVersion;
  setFeed(`Results for "${query}"`);
  showMessage($("videoGrid"), "Searching YouTube...");

  try {
    const data = await apiRequest("search", {
      part:"snippet",
      type:"video",
      maxResults:24,
      q:query
    });
    if (version !== requestVersion) return;
    renderVideoGrid((data.items || []).map(item => videoObject(item, "search")).filter(Boolean));
  } catch (error) {
    if (version !== requestVersion) return;
    showMessage($("videoGrid"), error.message, true);
  }
}

async function loadChannel(identifier, updateHistory = true) {
  identifier = identifier.trim().replace(/^@/, "");
  if (!identifier) return;

  const version = ++requestVersion;
  setFeed("Channel uploads");
  showMessage($("videoGrid"), "Loading channel...");

  if (updateHistory) {
    history.pushState({}, "", `?ch=${encodeURIComponent(identifier)}`);
  }

  try {
    const params = {
      part:"snippet,contentDetails,statistics"
    };

    if (identifier.startsWith("UC")) {
      params.id = identifier;
    } else {
      params.forHandle = identifier;
    }

    const data = await apiRequest("channels", params);
    if (version !== requestVersion) return;

    const channel = data.items?.[0];
    if (!channel) {
      showMessage($("videoGrid"), "Channel not found.", true);
      return;
    }

    currentChannelId = channel.id;
    const snippet = channel.snippet || {};
    const stats = channel.statistics || {};

    $("channelAvatar").src = snippet.thumbnails?.high?.url ||
      snippet.thumbnails?.default?.url || "";
    $("channelTitle").textContent = snippet.title || "Unknown channel";
    $("channelHandle").textContent = snippet.customUrl || "";
    $("channelStats").textContent =
      `${stats.hiddenSubscriberCount ? "Subscriber count hidden" : `${formatViews(stats.subscriberCount)} subscribers`} • ${formatViews(stats.videoCount)} videos`;
    $("channelHeader").classList.remove("hidden");
    $("channelHeader").classList.add("flex");
    $("feedTitle").textContent = "Uploads";

    const playlistId = channel.contentDetails?.relatedPlaylists?.uploads;
    if (!playlistId) {
      showMessage($("videoGrid"), "This channel's uploads playlist is unavailable.");
      return;
    }

    const uploads = await apiRequest("playlistItems", {
      part:"snippet",
      maxResults:24,
      playlistId
    });
    if (version !== requestVersion) return;

    renderVideoGrid((uploads.items || []).map(item => videoObject(item, "playlist")).filter(Boolean));
  } catch (error) {
    if (version !== requestVersion) return;
    showMessage($("videoGrid"), error.message, true);
  }
}

async function watchVideo(videoId, updateHistory = true) {
  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    showMessage($("relatedGrid"), "Invalid video ID.", true);
    return;
  }

  const version = ++requestVersion;
  currentVideoId = videoId;

  $("feedView").classList.add("hidden");
  $("watchView").classList.remove("hidden");
  $("videoTitle").textContent = "Loading video details...";
  $("videoChannel").textContent = "";
  $("videoViews").textContent = "";
  $("videoDescription").textContent = "";
  $("relatedGrid").replaceChildren();

  setPlayer(videoId, currentPlayer);

  if (updateHistory) {
    history.pushState({}, "", `?v=${encodeURIComponent(videoId)}`);
  }

  try {
    const data = await apiRequest("videos", {
      part:"snippet,statistics",
      id:videoId
    });

    if (version !== requestVersion) return;
    const item = data.items?.[0];

    if (!item) {
      $("videoTitle").textContent = "Video unavailable or deleted.";
      return;
    }

    const snippet = item.snippet || {};
    const stats = item.statistics || {};
    currentChannelId = snippet.channelId || "";

    $("videoTitle").textContent = snippet.title || "Untitled video";
    $("videoChannel").textContent = snippet.channelTitle || "Unknown channel";
    $("videoViews").textContent =
      `${formatViews(stats.viewCount)} views${snippet.publishedAt ? " • " + formatDate(snippet.publishedAt) : ""}`;
    $("videoDescription").textContent = snippet.description || "No description available.";

    fetchRelatedVideos(snippet.categoryId || "", videoId, version);
  } catch (error) {
    if (version !== requestVersion) return;
    $("videoTitle").textContent = "Couldn't load video details";
    $("videoDescription").textContent = error.message;
  }
}

async function fetchRelatedVideos(categoryId, excludeId, version) {
  const sidebar = $("relatedGrid");
  sidebar.replaceChildren(make("p", "text-sm text-neutral-500", "Loading more videos..."));

  try {
    const params = {
      part:"snippet,statistics",
      chart:"mostPopular",
      maxResults:12,
      regionCode:"IE"
    };
    if (categoryId) params.videoCategoryId = categoryId;

    const data = await apiRequest("videos", params);
    if (version !== requestVersion) return;

    const videos = (data.items || [])
      .filter(item => item.id !== excludeId)
      .slice(0, 8)
      .map(item => videoObject(item))
      .filter(Boolean);

    sidebar.replaceChildren();
    if (!videos.length) {
      sidebar.append(make("p", "text-sm text-neutral-500", "No recommendations available."));
      return;
    }

    videos.forEach(video => {
      const card = make("button", "w-full flex gap-3 text-left group hover:bg-ytHover p-2 rounded-lg");
      if (video.thumbnail) {
        const img = make("img", "w-36 aspect-video object-cover rounded-lg bg-neutral-900 shrink-0");
        img.src = video.thumbnail;
        img.alt = "";
        img.loading = "lazy";
        card.append(img);
      }
      const info = make("span", "min-w-0 space-y-1");
      info.append(
        make("span", "block text-xs font-semibold line-clamp-2", video.title),
        make("span", "block text-xs text-neutral-400", video.channelTitle),
        make("span", "block text-xs text-neutral-500", `${formatViews(video.views)} views`)
      );
      card.append(info);
      card.addEventListener("click", () => watchVideo(video.videoId));
      sidebar.append(card);
    });
  } catch (error) {
    if (version !== requestVersion) return;
    sidebar.replaceChildren(make("p", "text-xs text-neutral-500", "Recommendations unavailable."));
  }
}

function navigateHome(updateHistory = true) {
  ++requestVersion;
  if (updateHistory) history.pushState({}, "", location.pathname);
  currentChannelId = "";
  currentVideoId = "";
  setFeed("Trending videos");
  fetchTrendingVideos();
}

function restoreFromUrl() {
  const params = new URLSearchParams(location.search);
  const videoId = params.get("v");
  const channel = params.get("ch");

  if (videoId) {
    watchVideo(videoId, false);
  } else if (channel) {
    loadChannel(channel, false);
  } else {
    fetchTrendingVideos();
  }
}

$("homeButton").addEventListener("click", () => navigateHome());

$("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const query = $("searchInput").value.trim();
  if (!query) return;

  if (query.startsWith("@")) {
    loadChannel(query);
  } else if (query.startsWith("UC") && query.length === 24) {
    loadChannel(query);
  } else {
    searchVideos(query);
    history.pushState({}, "", `?q=${encodeURIComponent(query)}`);
  }
});

$("authorBox").addEventListener("click", () => {
  if (currentChannelId) loadChannel(currentChannelId);
});

document.querySelectorAll(".playerButton").forEach(button => {
  button.addEventListener("click", () => {
    if (currentVideoId) setPlayer(currentVideoId, button.dataset.player);
  });
});

window.addEventListener("popstate", restoreFromUrl);
window.addEventListener("DOMContentLoaded", restoreFromUrl);
</script>
</body>
</html>
