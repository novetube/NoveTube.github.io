<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--bg:#0f0f0f;--bg2:#212121;--bg3:#272727;--bg4:#1e1e1e;--text:#f1f1f1;--text2:#aaaaaa;--text3:#717171;--border:#3f3f3f;--red:#ff0000;--red2:#cc0000;--hover:#272727;--sidebar:240px;--hh:56px;--radius:12px;}html{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;}body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}button{background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;font-size:inherit;}input{font-family:inherit;font-size:inherit;}img{display:block;max-width:100%;}svg{flex-shrink:0;display:block;}::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px;}::-webkit-scrollbar-thumb:hover{background:#555;}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#0f0f0f;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);}#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}#hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--hh);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;border-bottom:1px solid #1a1a1a;}.hl{display:flex;align-items:center;gap:2px;}#menuBtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;margin-right:10px;}#menuBtn:hover{background:var(--hover);}.logo{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:4px 8px;border-radius:6px;transition:background .1s;}.logo:hover{background:var(--hover);}.logo-mark{width:32px;height:22px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}.logo-name{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1;color:var(--text);}.logo-name sup{font-size:9px;font-weight:500;color:var(--text3);margin-left:1px;vertical-align:super;letter-spacing:0;}.hc{display:flex;align-items:center;gap:8px;flex:1;max-width:720px;margin:0 auto;}#searchForm{display:flex;flex:1;height:40px;}#searchInput{flex:1;height:100%;padding:0 16px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-right:none;border-radius:40px 0 0 40px;outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s;}#searchInput::placeholder{color:var(--text3);}#searchInput:focus{border-color:#1c62b9;box-shadow:inset 0 0 0 1px #1c62b9;}#searchBtn{width:64px;height:100%;flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-left:none;border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;}#searchBtn:hover{background:var(--bg3);}.mic-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;}.mic-btn:hover{background:var(--bg3);}.hr{display:flex;align-items:center;gap:8px;}#privacyBadge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:20px;background:#0d1f0d;color:#4caf50;border:1px solid #1e4d1e;user-select:none;white-space:nowrap;}#apiStatus{font-size:11px;font-weight:600;white-space:nowrap;padding:5px 10px;border-radius:6px;background:var(--bg2);color:var(--text3);border:1px solid var(--border);transition:background .3s,color .3s;}#apiStatus.ok{background:#0d1f0d;color:#4caf50;border-color:#1e4d1e;}#apiStatus.err{background:#1f0d0d;color:#f44336;border-color:#4d1e1e;}#layout{display:flex;margin-top:var(--hh);}#sidebar{width:var(--sidebar);min-width:var(--sidebar);position:fixed;top:var(--hh);left:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:12px 0 24px;transition:transform .2s ease,width .2s ease;z-index:100;}#sidebar.collapsed{width:72px;min-width:72px;}.si{display:flex;align-items:center;gap:20px;padding:0 16px;height:40px;border-radius:10px;margin:0 8px;cursor:pointer;font-size:14px;font-weight:500;transition:background .1s;white-space:nowrap;color:var(--text);overflow:hidden;}#sidebar.collapsed .si{padding:0;justify-content:center;margin:0 4px;}#sidebar.collapsed .si-label{display:none;}.si:hover{background:var(--hover);}.si.active{background:var(--bg3);}.sdiv{border:none;border-top:1px solid var(--border);margin:10px 0;}.ssec{padding:14px 16px 6px;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;}#sidebar.collapsed .ssec{display:none;}#sidebar.collapsed .sdiv{margin:8px 8px;}#main{margin-left:var(--sidebar);flex:1;padding:20px 24px 48px;min-height:calc(100vh - var(--hh));background:var(--bg);transition:margin-left .2s ease;}#main.collapsed{margin-left:72px;}#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:10;padding-top:4px;}#chips::-webkit-scrollbar{display:none;}.chip{flex-shrink:0;padding:0 12px;height:32px;background:var(--bg2);border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;cursor:pointer;transition:background .1s;white-space:nowrap;color:var(--text);border:none;}.chip:hover{background:var(--bg3);}.chip.active{background:var(--text);color:var(--bg);}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 16px;}.vc{cursor:pointer;outline:none;}.vc:focus-visible .vthumb{box-shadow:0 0 0 2px #fff;}.vthumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;transition:border-radius .2s;}.vc:hover .vthumb{border-radius:0;}.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}.vc:hover .vthumb img{transform:scale(1.03);}.vdur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.88);color:#fff;font-size:12px;font-weight:500;padding:2px 6px;border-radius:4px;letter-spacing:.2px;}.vmeta{display:flex;gap:12px;padding:0 2px;}.vavatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);margin-top:2px;}.vavatar img{width:100%;height:100%;object-fit:cover;}.vtitle{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.vchan{font-size:13px;color:var(--text2);margin-bottom:2px;display:flex;align-items:center;gap:4px;}.vstats{font-size:12px;color:var(--text3);}.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shim 1.6s infinite;border-radius:4px;}@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}.sk-thumb{aspect-ratio:16/9;border-radius:var(--radius);margin-bottom:10px;}.sk-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;margin-top:2px;}.sk-line{height:13px;margin-bottom:8px;}.sk-line.s{width:70%;}.sk-line.xs{width:50%;}.empty{color:var(--text2);text-align:center;padding:80px 20px;font-size:15px;line-height:1.8;}.empty.err{color:#f44336;}.empty code{background:var(--bg2);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:13px;color:var(--text);}</style></head><body><div id="toast"></div><header id="hdr"><div class="hl"><button id="menuBtn" aria-label="Toggle sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="logo" id="homeBtn" role="button" tabindex="0" aria-label="NoveTube home"><div class="logo-mark"><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><polygon points="5,0 16,6 5,12" fill="#fff"/></svg></div><span class="logo-name">NoveTube<sup>Private</sup></span></div></div><div class="hc"><form id="searchForm"><input id="searchInput" type="search" placeholder="Search or paste a YouTube URL…" autocomplete="off" spellcheck="false"><button id="searchBtn" type="submit" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button></form><button class="mic-btn" aria-label="Voice search"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button></div><div class="hr"><div id="privacyBadge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>No tracking</div><div id="apiStatus">Checking…</div></div></header><div id="layout"><nav id="sidebar" aria-label="Navigation"><div class="si active" id="sideHome" role="button" tabindex="0"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="si-label">Home</span></div></nav><main id="main"><div id="feedView"><div id="videoGrid"></div></div></main></div><script>"use strict";
const API_KEY="__YOUTUBE_API_KEY__";
const API_BASE="https://www.googleapis.com/youtube/v3";
const $=id=>document.getElementById(id);
const $$=sel=>document.querySelectorAll(sel);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtViews(n){n=parseInt(n)||0;if(n>=1e9)return(n/1e9).toFixed(1)+'B views';if(n>=1e6)return(n/1e6).toFixed(1)+'M views';if(n>=1e3)return Math.round(n/1e3)+'K views';return n+' views';}
function fmtAgo(iso){if(!iso)return'';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hours ago';if(s<2592000)return Math.floor(s/86400)+' days ago';return Math.floor(s/31536000)+' years ago';}
function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function hasKey(){return typeof API_KEY==='string'&&API_KEY.startsWith('AIza')&&API_KEY.trim().length>10;}
function setStatus(ok,msg){const el=$('apiStatus');el.textContent=ok?'API live':('Error'+(msg?': '+msg:''));el.className=ok?'ok':'err';}
async function apiReq(endpoint,params={}){if(!hasKey()){setStatus(false,'no key');throw new Error('No API key configured');}const url=new URL(API_BASE+'/'+endpoint);Object.entries({...params,key:API_KEY}).forEach(([k,v])=>v!=null&&url.searchParams.set(k,v));const res=await fetch(url);const data=await res.json();if(!res.ok||data.error){const msg=data?.error?.message||'HTTP '+res.status;setStatus(false,msg);throw new Error(msg);}setStatus(true);return data;}
async function loadTrending(){
  const g=$('videoGrid');
  g.innerHTML='<p style="color:#aaa">Loading vids...</p>';
  try {
    const data = await apiReq('videos', {part:'snippet,statistics', chart:'mostPopular', maxResults:20, regionCode:'US'});
    if(data.items && data.items.length > 0){
      g.innerHTML='';
      data.items.forEach(v=>{
        const id=v.id;
        const title=v.snippet.title;
        const chan=v.snippet.channelTitle;
        const thumb=v.snippet.thumbnails.high?v.snippet.thumbnails.high.url:v.snippet.thumbnails.default.url;
        const views=v.statistics?.viewCount;
        const date=v.snippet.publishedAt;
        const el=document.createElement('div');
        el.className='vc';
        el.innerHTML='<div class="vthumb"><img src="'+esc(thumb)+'"></div><div class="vmeta"><div class="vavatar">'+esc(initials(chan))+'</div><div style="min-width:0"><div class="vtitle">'+esc(title)+'</div><div class="vchan">'+esc(chan)+'</div><div class="vstats">'+(views?fmtViews(views)+' · ':'')+fmtAgo(date)+'</div></div></div>';
        el.onclick=()=>location.href='https://www.youtube.com/watch?v='+id;
        g.appendChild(el);
      });
    } else {
      g.innerHTML='<p style="color:#ff4444">No videos found.</p>';
    }
  } catch(e) {
    g.innerHTML='<p style="color:#ff4444">Failed to load vids: '+esc(e.message)+'</p>';
  }
}
loadTrending();
</script></body></html>
