<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NoveTube</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23ff0000'/%3E%3Cpolygon points='40,30 75,50 40,70' fill='%23ffffff'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{ytBlack:"#0a0a0a",ytCard:"#171717",ytRed:"#ff0000"}}}};</script>
</head>
<body class="bg-gradient-to-br from-neutral-950 via-ytBlack to-neutral-900 text-white min-h-screen flex flex-col font-sans antialiased">
<header class="sticky top-0 z-50 bg-ytBlack/80 backdrop-blur-md border-b border-neutral-800/80 px-6 h-16 flex items-center justify-between gap-4 shadow-2xl">
<button id="homeButton" class="flex items-center gap-2.5 shrink-0 hover:opacity-80 transition"><span class="bg-gradient-to-r from-red-600 to-ytRed text-white px-3 py-1.5 rounded-xl text-sm font-black shadow-lg shadow-red-900/40">▶</span><span class="font-black text-xl tracking-tight bg-gradient-to-r from-white via-neutral-100 to-neutral-400 bg-clip-text text-transparent">NoveTube</span></button>
<form id="searchForm" class="flex items-center w-full max-w-2xl"><input id="searchInput" type="search" placeholder="Search videos..." class="w-full bg-neutral-900/90 border border-neutral-700/60 rounded-l-full px-6 py-2.5 text-sm focus:outline-none focus:border-red-500/80 transition backdrop-blur-sm"><button class="bg-gradient-to-r from-neutral-800 to-neutral-700 border border-l-0 border-neutral-700/60 px-6 py-2.5 rounded-r-full hover:from-neutral-700 hover:to-neutral-600 transition">⌕</button></form>
<div id="queueBadge" class="hidden shrink-0 text-xs px-3.5 py-1.5 rounded-full font-semibold border border-red-500/30 bg-red-950/40 text-red-400 flex items-center gap-2 shadow-sm"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span><span id="queueCount">0 Queue</span></div>
</header>
<main class="flex-1 max-w-[1800px] w-full mx-auto p-6 space-y-8">
<section id="feedView" class="space-y-6"><div class="flex items-center justify-between"><h2 id="feedTitle" class="text-2xl font-black bg-gradient-to-r from-white to-neutral-400 bg-clip-text text-transparent">Queue / Trending</h2><button id="clearQueueBtn" class="hidden text-xs text-neutral-400 hover:text-red-400 border border-neutral-800 bg-neutral-900/80 px-3 py-1.5 rounded-lg transition">Clear Queue</button></div><div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div></section>
<section id="watchView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
<div class="lg:col-span-2 space-y-4">
<div class="relative w-full aspect-video bg-black rounded-3xl overflow-hidden border border-neutral-800 shadow-2xl"><iframe id="privacyPlayer" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<h1 id="videoTitle" class="text-2xl font-bold text-white">Loading...</h1>
<p id="videoChannel" class="text-sm font-semibold text-neutral-400"></p>
</div>
<aside class="space-y-4"><h3 class="font-bold text-lg text-neutral-200">Up Next</h3><div id="upNextGrid" class="space-y-3"></div></aside>
</section>
</main>
<script>
"use strict";
const API_KEY="__YOUTUBE_API_KEY__",API_BASE="https://www.googleapis.com/youtube/v3",$ = id=>document.getElementById(id);
function getQueue(){return JSON.parse(localStorage.getItem("novetube_queue")||"[]");}
function saveQueue(q){localStorage.setItem("novetube_queue",JSON.stringify(q));updateBadge();}
function addToQueue(v){let q=getQueue();if(!q.some(x=>x.id===v.id)){q.push(v);saveQueue(q);}}
function removeFromQueue(id){let q=getQueue().filter(x=>x.id!==id);saveQueue(q);}
function updateBadge(){const q=getQueue(),b=$("queueBadge"),c=$("queueCount"),cl=$("clearQueueBtn");if(q.length){b.classList.remove("hidden");cl.classList.remove("hidden");c.textContent=`${q.length} Saved`;}else{b.classList.add("hidden");cl.classList.add("hidden");}}
async function apiReq(e,p={}){if(!API_KEY||API_KEY==="__YOUTUBE_API_KEY__")throw new Error("Missing API Key");const u=new URL(`${API_BASE}/${e}`);Object.entries({...p,key:API_KEY}).forEach(([k,v])=>v&&u.searchParams.set(k,v));const r=await fetch(u),d=await r.json();if(!r.ok||d.error)throw new Error(d?.error?.message||"Error");return d;}
function renderCard(v,isQueue=false){return `<div class="group cursor-pointer space-y-3 p-3.5 rounded-2xl bg-gradient-to-b from-neutral-900/80 to-ytCard/80 border border-neutral-800/80 hover:border-neutral-700 hover:from-neutral-800 hover:to-neutral-900 transition-all duration-300 shadow-xl hover:-translate-y-1" onclick="play('${v.id}','${v.title.replace(/'/g,"&#39;")}','${v.channel.replace(/'/g,"&#39;")}')"><div class="aspect-video bg-neutral-950 rounded-xl overflow-hidden relative shadow-inner"><img src="${v.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">${isQueue?'<span class="absolute top-2 right-2 bg-red-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-0.5 rounded-full">Queue</span>':''}</div><h3 class="font-bold text-sm line-clamp-2 text-neutral-100 group-hover:text-white transition-colors">${v.title}</h3><p class="text-xs font-semibold text-neutral-400">${v.channel}</p></div>`;}
function renderFeed(videos){const g=$("videoGrid"),q=getQueue();g.innerHTML="";if(q.length){g.innerHTML=q.map(v=>renderCard(v,true)).join("");}videos.forEach(v=>{if(!q.some(x=>x.id===v.id)){addToQueue(v);g.innerHTML+=renderCard(v,true);}});if(!g.innerHTML)g.innerHTML="<p class='col-span-full text-center py-12 text-neutral-500 font-medium'>No videos found.</p>";}
async function loadTrending(){$("watchView").classList.add("hidden");$("feedView").classList.remove("hidden");$("videoGrid").innerHTML="<p class='col-span-full text-center py-12 text-neutral-400 animate-pulse font-medium'>Loading videos...</p>";try{const d=await apiReq("videos",{part:"snippet",chart:"mostPopular",maxResults:24,regionCode:"US"});renderFeed((d.items||[]).map(i=>({id:i.id,title:i.snippet.title,channel:i.snippet.channelTitle,thumb:i.snippet.thumbnails?.high?.url})));}catch(e){$("videoGrid").innerHTML=`<p class='col-span-full text-center py-12 text-rose-400 font-medium'>${e.message}</p>`;}}
function play(id,title,channel){$("feedView").classList.add("hidden");$("watchView").classList.remove("hidden");$("videoTitle").textContent=title||"";$("videoChannel").textContent=channel\vert{}\vert{}"";$("privacyPlayer").src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;removeFromQueue(id);renderUpNext();}
function renderUpNext(){const q=getQueue(),u=$("upNextGrid");u.innerHTML="";if(!q.length){u.innerHTML="<p class='text-xs text-neutral-500'>No more queued videos.</p>";return;}q.slice(0,5).forEach(v=>{const d=document.createElement("div");d.className="flex gap-3 cursor-pointer group p-2 rounded-xl hover:bg-neutral-900/80 transition";d.innerHTML=`<div class="w-32 aspect-video bg-neutral-950 rounded-lg overflow-hidden shrink-0"><img src="${v.thumb}" class="w-full h-full object-cover"></div><div class="space-y-1"><h4 class="text-xs font-bold line-clamp-2 text-neutral-200 group-hover:text-white">${v.title}</h4><p class="text-[10px] text-neutral-400">${v.channel}</p></div>`;d.onclick=()=>play(v.id,v.title,v.channel);u.appendChild(d);});}
$("homeButton").onclick=()=>{($("watchView").classList.add("hidden"),$("feedView").classList.remove("hidden"),loadTrending());};
$("clearQueueBtn").onclick=()=>{saveQueue([]);renderFeed([]);};
$("searchForm").onsubmit=async e=>{e.preventDefault();const q=$("searchInput").value.trim();if(!q)return;$("watchView").classList.add("hidden");$("feedView").classList.remove("hidden");$("videoGrid").innerHTML="<p class='col-span-full text-center py-12 text-neutral-400 animate-pulse font-medium'>Searching...</p>";try{const d=await apiReq("search",{part:"snippet",type:"video",maxResults:20,q:q});renderFeed((d.items||[]).map(i=>({id:i.id.videoId,title:i.snippet.title,channel:i.snippet.channelTitle,thumb:i.snippet.thumbnails?.high?.url})));}catch(e){$("videoGrid").innerHTML=`<p class='col-span-full text-center py-12 text-rose-400 font-medium'>${e.message}</p>`;}};
updateBadge();loadTrending();
</script>
</body>
</html>
