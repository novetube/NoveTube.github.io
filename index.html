<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoveTube</title><style>*,::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0f0f;--bg2:#212121;--text:#f1f1f1;--text2:#aaa;--border:#3f3f3f;--red:#ff0000}html,body{background:var(--bg);color:var(--text);font-family:sans-serif;font-size:14px;min-height:100vh}body{display:flex;flex-direction:column}header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);z-index:200}.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:20px}.logo-mark{width:34px;height:24px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center}#main{margin-top:56px;padding:24px;flex:1}#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.vc{cursor:pointer}.vthumb{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}.vthumb img{width:100%;height:100%;object-fit:cover}.vtitle{font-weight:500;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vchan{font-size:12px;color:var(--text2)}#debugBox{background:#1a1a1a;border:1px solid var(--border);padding:12px;margin-bottom:16px;border-radius:8px;font-family:monospace;font-size:12px;color:#ff4444;word-break:break-all}</style></head><body><header><div class="logo"><div class="logo-mark">▶</div>NoveTube</div></header><main id="main"><div id="debugBox" style="display:none"></div><div id="videoGrid"></div></main><script>const apiKey='__YOUTUBE_API_KEY__';function showDebug(msg){const dbg=document.getElementById('debugBox');dbg.style.display='block';dbg.textContent='DEBUG: '+msg;}async function loadVideos(){const grid=document.getElementById('videoGrid');if(apiKey.startsWith('__')){grid.innerHTML='<p style="color:#ff4444">API key not injected yet by GitHub Actions!</p>';showDebug('Placeholder __YOUTUBE_API_KEY__ was not replaced.');return;}grid.innerHTML='<p style="color:#aaa">Loading trending vids...</p>';try{const res=await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=20&regionCode=US&key='+apiKey);const data=await res.json();if(!res.ok){throw new Error(data.error?.message||'HTTP '+res.status);}if(data.items&&data.items.length>0){grid.innerHTML='';data.items.forEach(v=>{const id=v.id;const title=v.snippet.title;const chan=v.snippet.channelTitle;const thumb=v.snippet.thumbnails.high?v.snippet.thumbnails.high.url:v.snippet.thumbnails.default.url;const el=document.createElement('div');el.className='vc';el.innerHTML='<div class="vthumb"><img src="'+thumb+'"></div><div class="vtitle">'+title+'</div><div class="vchan">'+chan+'</div>';el.onclick=()=>location.href='https://www.youtube.com/watch?v='+id;grid.appendChild(el);});}else{grid.innerHTML='<p style="color:#ff4444">No trending videos found.</p>';}}catch(e){grid.innerHTML='<p style="color:#ff4444">Failed to load vids. Check error below!</p>';showDebug(e.message);}}loadVideos();</script></body></html>
