<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoveTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0f0f0f;--bg2:#212121;--bg3:#272727;--bg4:#1a1a1a;--text:#f1f1f1;--text2:#aaaaaa;--text3:#717171;--border:#3f3f3f;--red:#ff0000;--red2:#cc0000;--hover:#272727;--sidebar:240px;--header:56px;}
html{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;height:100%;}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
a{color:inherit;text-decoration:none;}
button{background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;font-size:inherit;}
input{font-family:inherit;font-size:inherit;}
img{display:block;max-width:100%;}
svg{flex-shrink:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#555;}
#hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--header);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;border-bottom:1px solid var(--border);}
.hl{display:flex;align-items:center;gap:4px;}
#menuBtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;margin-right:12px;}
#menuBtn:hover{background:var(--hover);}
.logo{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.logo-mark{width:34px;height:24px;background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center;}
.logo-mark svg{margin-left:2px;}
.logo-name{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1;}
.logo-name sup{font-size:10px;font-weight:400;color:var(--text2);margin-left:1px;vertical-align:super;}
.hc{display:flex;align-items:center;gap:8px;flex:1;max-width:728px;margin:0 auto;}
#searchForm{display:flex;flex:1;height:40px;}
#searchInput{flex:1;height:100%;padding:0 16px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-right:none;border-radius:40px 0 0 40px;outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s;}
#searchInput::placeholder{color:var(--text3);}
#searchInput:focus{border-color:#1c62b9;box-shadow:inset 0 0 0 1px #1c62b9;}
#searchBtn{width:64px;height:100%;background:var(--bg2);border:1px solid var(--border);border-left:none;border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;}
#searchBtn:hover{background:var(--bg3);}
.mic-btn{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .1s;}
.mic-btn:hover{background:var(--bg3);}
.hr{display:flex;align-items:center;gap:8px;}
#privacyBadge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.3px;padding:4px 10px;border-radius:20px;background:#0d1f0d;color:#4caf50;border:1px solid #1e4d1e;user-select:none;}
#privacyBadge svg{color:#4caf50;}
#apiStatus{font-size:11px;font-weight:600;padding:4px 10px;border-radius:4px;background:var(--bg2);color:var(--text2);border:1px solid var(--border);}
#apiStatus.ok{background:#0d1f0d;color:#4caf50;border-color:#1e4d1e;}
#apiStatus.err{background:#1f0d0d;color:#f44336;border-color:#4d1e1e;}
#layout{display:flex;margin-top:var(--header);}
#sidebar{width:var(--sidebar);min-width:var(--sidebar);position:fixed;top:var(--header);left:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:12px 0;transition:transform .2s ease;z-index:100;}
.si{display:flex;align-items:center;gap:20px;padding:0 16px;height:40px;border-radius:10px;margin:0 8px;cursor:pointer;font-size:14px;font-weight:500;transition:background .1s;white-space:nowrap;color:var(--text);}
.si:hover{background:var(--hover);}
.si.active{background:var(--bg3);}
.si svg{flex-shrink:0;color:var(--text);}
.sdiv{border:none;border-top:1px solid var(--border);margin:10px 0;}
.ssec{padding:14px 16px 6px;font-size:14px;font-weight:600;color:var(--text);}
#main{margin-left:var(--sidebar);flex:1;padding:24px 24px 40px;min-height:calc(100vh - var(--header));background:var(--bg);}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:20px;scrollbar-width:none;position:sticky;top:var(--header);background:var(--bg);z-index:10;padding-top:2px;}
#chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:0 12px;height:32px;background:var(--bg2);border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;cursor:pointer;transition:background .1s;white-space:nowrap;color:var(--text);border:none;}
.chip:hover{background:var(--bg3);}
.chip.active{background:var(--text);color:var(--bg);}
#videoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 16px;}
.vc{cursor:pointer;}
.vc:hover .vthumb img{transform:scale(1.04);}
.vthumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px;}
.vthumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
.vdur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.85);color:#fff;font-size:12px;font-weight:500;padding:1px 5px;border-radius:4px;}
.vmeta{display:flex;gap:12px;}
.vavatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text2);}
.vavatar img{width:100%;height:100%;object-fit:cover;}
.vtitle{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vchan{font-size:13px;color:var(--text2);margin-bottom:1px;}
.vstats{font-size:13px;color:var(--text2);}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:4px;}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-thumb{aspect-ratio:16/9;border-radius:12px;margin-bottom:10px;}
.sk-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;}
.sk-line{height:13px;margin-bottom:7px;}
.sk-line.s{width:65%;}
.sk-line.xs{width:45%;}
.empty{color:var(--text2);text-align:center;padding:60px 20px;font-size:15px;}
.empty.err{color:#f44336;}
#watchView{display:none;}
#wlayout{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start;}
.pwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px;}
#player{width:100%;height:100%;border:none;display:block;}
#wtitle{font-size:20px;font-weight:600;line-height:1.4;color:var(--text);margin-bottom:10px;}
.wmeta{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
.wchanwrap{display:flex;align-items:center;gap:10px;}
.wchanav{width:40px;height:40px;border-radius:50%;background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--text2);}
.wchanav img{width:100%;height:100%;object-fit:cover;}
#wchan{font-size:15px;font-weight:600;color:var(--text);}
#wstats{font-size:13px;color:var(--text2);}
.wactions{display:flex;gap:8px;flex-wrap:wrap;}
.wabtn{display:flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:18px;background:var(--bg2);font-size:14px;font-weight:500;color:var(--text);transition:background .1s;border:none;cursor:pointer;}
.wabtn:hover{background:var(--bg3);}
.wabtn svg{flex-shrink:0;}
.wdiv{border:none;border-top:1px solid var(--border);margin:14px 0;}
.wdesc{background:var(--bg2);border-radius:12px;padding:14px;font-size:14px;color:var(--text2);line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden;cursor:pointer;position:relative;transition:max-height .3s;}
.wdesc.expanded{max-height:none;}
.wdesc::after{content:'Show more';position:absolute;bottom:0;left:0;right:0;padding:24px 14px 8px;background:linear-gradient(transparent,var(--bg2));font-size:13px;font-weight:500;color:var(--text);text-align:right;}
.wdesc.expanded::after{display:none;}
.unc{position:sticky;top:72px;}
.untitle{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text);}
.uncard{display:flex;gap:8px;cursor:pointer;padding:4px;border-radius:8px;transition:background .1s;margin-bottom:2px;}
.uncard:hover{background:var(--hover);}
.unthumb{width:168px;flex-shrink:0;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;position:relative;}
.unthumb img{width:100%;height:100%;object-fit:cover;}
.undur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.85);color:#fff;font-size:11px;font-weight:500;padding:1px 4px;border-radius:3px;}
.uninfo .t{font-size:13px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);margin-bottom:3px;}
.uninfo .c{font-size:12px;color:var(--text2);}
.uninfo .s{font-size:12px;color:var(--text2);}
#pastebar{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:20px;align-items:center;gap:10px;flex-wrap:wrap;}
#pastebar.show{display:flex;}
#pasteMsg{font-size:14px;color:var(--text2);flex:1;}
#pasteMsg strong{color:var(--text);}
#pasteGoBtn{padding:0 16px;height:34px;border-radius:8px;background:var(--red);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:background .1s;}
#pasteGoBtn:hover{background:var(--red2);}
#pasteDismiss{padding:0 12px;height:34px;border-radius:8px;background:var(--bg3);color:var(--text2);font-size:14px;border:none;cursor:pointer;transition:background .1s;}
#pasteDismiss:hover{background:var(--border);}
@media(max-width:1200px){#wlayout{grid-template-columns:1fr;}.unc{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}.untitle{grid-column:1/-1;}}
@media(max-width:960px){#sidebar{transform:translateX(-100%);}#sidebar.open{transform:translateX(0);}#main{margin-left:0;}}
@media(max-width:640px){#videoGrid{grid-template-columns:1fr;}.hc{max-width:none;}#main{padding:16px 12px 40px;}}
</style>
</head>
<body>
<header id="hdr">
  <div class="hl">

<div id="layout">
  <nav id="sidebar" aria-label="Main navigation">
    <div class="si active" id="sideHome"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
    <div class="si" data-chip=""><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.66 11.2c-.23-.3-.51-.56-.77-.82-.67-.6-1.43-1.03-2.07-1.66C13.33 7.26 13 4.85 13.95 3c-.95.23-1.78.75-2.49 1.32-2.59 2.08-3.61 5.75-2.39 8.9.04.1.08.2.08.33 0 .22-.15.42-.35.5-.23.1-.47.04-.66-.12a.58.58 0 0 1-.14-.17c-1.13-1.43-1.31-3.48-.55-5.12C5.78 10 4.87 12.3 5 14.47c.06.5.12 1 .29 1.5.14.6.41 1.2.71 1.73 1.08 1.73 2.95 2.97 5 3.27 2.14.32 4.44-.22 6.01-1.64 1.86-1.6 2.6-4 1.87-6.3l-.12-.33c-.21-.6-.36-1.2-.1-1.8z"/></svg>Trending</div>
    <div class="si"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm0-4h2v2h-2zm-6 0h4v2h-4z"/></svg>Subscriptions</div>

  <main id="main">
    <div id="feedView">
      <div id="pastebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#4caf50"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span id="pasteMsg">YouTube link detected</span>
        <button id="pasteGoBtn">Watch on NoveTube</button>

      </div>
      <div id="chips">
        <button class="chip active" data-q="">All</button>
        <button class="chip" data-q="music">Music</button>
        <button class="chip" data-q="gaming">Gaming</button>
        <button class="chip" data-q="news">News</button>
        <button class="chip" data-q="sports">Sports</button>
        <button class="chip" data-q="technology">Technology</button>
        <button class="chip" data-q="cooking">Cooking</button>
        <button class="chip" data-q="travel">Travel</button>
        <button class="chip" data-q="comedy">Comedy</button>
        <button class="chip" data-q="education">Education</button>
        <button class="chip" data-q="science">Science</button>
        <button class="chip" data-q="fashion">Fashion</button>
        <button class="chip" data-q="fitness">Fitness</button>
      </div>
      <div id="videoGrid"></div>
    </div>
    <div id="watchView">
      <div id="wlayout">
        <div class="wp">
          <div class="pwrap">
            <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; web-share"></iframe>
          </div>
          <h1 id="wtitle">Loading…</h1>
