name: Deploy NoveTube
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject API Key
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API }}
        run: |
          python3 -c '
          import os
          key = os.environ.get("YT_KEY", "")
          with open("index.html", "r") as f:
              content = f.read()
          content = content.replace("__YOUTUBE_API_KEY__", key)
          with open("index.html", "w") as f:
              f.write(content)
          '
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
