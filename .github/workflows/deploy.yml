name: Deploy NoveTube
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject API Key
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API }}
        run: |
          python3 -c '
          import os
          k = os.environ.get("YT_KEY", "")
          if not k: raise Exception("YOUTUBE_API secret is empty or missing")
          with open("index.html", "r") as f: c = f.read()
          if "__YOUTUBE_API_KEY__" not in c: raise Exception("Placeholder not found in index.html")
          c = c.replace("__YOUTUBE_API_KEY__", k)
          with open("index.html", "w") as f: f.write(c)
          print("Successfully injected secret")
          '
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
