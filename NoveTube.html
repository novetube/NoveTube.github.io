<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoveTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;
  --bg2:#212121;
  --bg3:#272727;
  --text:#f1f1f1;
  --text2:#aaa;
  --text3:#717171;
  --border:#3f3f3f;
  --red:#ff0000;
  --hover:#272727;
  --sidebar:240px;
}
html{background:var(--bg);color:var(--text);font-family:'Roboto',sans-serif;font-size:14px;}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
a{color:inherit;text-decoration:none;}
button{background:none;border:none;cursor:pointer;color:inherit;font-family:inherit;}
input{font-family:inherit;}
img{display:block;max-width:100%;}

/* SCROLLBAR */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3f3f3f;border-radius:4px;}

/* HEADER */
#header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:56px;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;gap:8px;
  border-bottom:1px solid transparent;
}
.header-left{display:flex;align-items:center;gap:16px;}
#menuBtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s;}
#menuBtn:hover{background:var(--hover);}
#menuBtn span{display:block;width:18px;height:2px;background:var(--text);border-radius:1px;position:relative;}
#menuBtn span::before,#menuBtn span::after{content:'';position:absolute;left:0;width:18px;height:2px;background:var(--text);border-radius:1px;}
#menuBtn span::before{top:-6px;}
#menuBtn span::after{top:6px;}
.logo{display:flex;align-items:center;gap:4px;}
.logo-icon{width:28px;height:20px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}
.logo-icon::after{content:'';border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px;}
.logo-text{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
.logo-text span{font-weight:400;color:var(--text2);font-size:11px;vertical-align:super;margin-left:1px;}

/* SEARCH */
.header-center{display:flex;align-items:center;gap:8px;flex:1;max-width:720px;margin:0 auto;}
#searchForm{display:flex;align-items:center;flex:1;}
#searchInput{
  flex:1;height:40px;
  background:var(--bg);
  border:1px solid var(--border);
  border-right:none;
  border-radius:40px 0 0 40px;
  padding:0 16px;
  color:var(--text);
  font-size:16px;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
#searchInput:focus{border-color:#1c62b9;box-shadow:inset 0 0 0 1px #1c62b9;}
#searchInput::placeholder{color:var(--text3);}
#searchBtn{
  height:40px;width:64px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-left:none;
  border-radius:0 40px 40px 0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
  font-size:18px;
}
#searchBtn:hover{background:var(--bg3);}
.voice-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  transition:background .15s;
}
.voice-btn:hover{background:var(--bg3);}
.header-right{display:flex;align-items:center;gap:8px;}
#apiStatus{
  font-size:12px;font-weight:500;
  padding:4px 10px;border-radius:4px;
  background:var(--bg2);color:var(--text2);
  border:1px solid var(--border);
}
#apiStatus.ok{background:#1a2e1a;color:#4caf50;border-color:#2d4d2d;}
#apiStatus.err{background:#2e1a1a;color:#f44336;border-color:#4d2d2d;}

/* LAYOUT */
#layout{display:flex;margin-top:56px;}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar);
  position:fixed;top:56px;left:0;bottom:0;
  overflow-y:auto;overflow-x:hidden;
  background:var(--bg);
  padding:12px 0;
  flex-shrink:0;
  transition:transform .2s;
}
.sidebar-item{
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:40px;border-radius:10px;
  margin:0 4px;
  cursor:pointer;font-size:14px;font-weight:500;
  transition:background .1s;
  white-space:nowrap;
}
.sidebar-item:hover{background:var(--hover);}
.sidebar-item.active{background:var(--bg3);}
.sidebar-item .icon{font-size:20px;width:24px;text-align:center;flex-shrink:0;}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.sidebar-section{padding:16px 24px 8px;font-size:14px;font-weight:500;color:var(--text);letter-spacing:0;}

/* MAIN */
#main{
  margin-left:var(--sidebar);
  flex:1;
  padding:24px;
  min-height:calc(100vh - 56px);
  background:var(--bg);
}

/* CHIPS / FILTERS */
#chips{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:12px;margin-bottom:20px;
  scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;
  padding:0 12px;height:32px;
  background:var(--bg2);
  border-radius:8px;
  font-size:14px;font-weight:500;
  display:flex;align-items:center;
  cursor:pointer;
  transition:background .15s;
  white-space:nowrap;
  color:var(--text);
}
.chip:hover{background:var(--bg3);}
.chip.active{background:var(--text);color:var(--bg);}

/* VIDEO GRID */
#videoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px 16px;
}
.video-card{cursor:pointer;}
.video-card:hover .thumb-wrap img{transform:scale(1.03);}
.thumb-wrap{
  position:relative;aspect-ratio:16/9;
  background:#000;border-radius:12px;overflow:hidden;
  margin-bottom:12px;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.thumb-duration{
  position:absolute;bottom:4px;right:4px;
  background:rgba(0,0,0,.8);color:#fff;
  font-size:12px;font-weight:500;
  padding:1px 4px;border-radius:4px;
}
.video-meta{display:flex;gap:12px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--text2);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.video-info{}
.video-title{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
.video-channel{font-size:13px;color:var(--text2);margin-bottom:2px;}
.video-stats{font-size:13px;color:var(--text2);}

/* LOADING */
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skel-thumb{aspect-ratio:16/9;border-radius:12px;margin-bottom:12px;}
.skel-line{height:14px;border-radius:4px;margin-bottom:8px;}
.skel-line.short{width:60%;}
.skel-line.shorter{width:40%;}

/* ERROR/EMPTY */
.msg{color:var(--text2);text-align:center;padding:60px 20px;font-size:15px;}
.msg.err{color:#f44336;}

/* === WATCH VIEW === */
#watchView{display:none;}
#watchLayout{display:grid;grid-template-columns:1fr 402px;gap:24px;align-items:start;}
.player-col{}
.player-wrap{
  position:relative;aspect-ratio:16/9;
  background:#000;border-radius:12px;overflow:hidden;
  margin-bottom:16px;
}
#player{width:100%;height:100%;border:none;display:block;}
#watchTitle{font-size:20px;font-weight:600;line-height:1.4;color:var(--text);margin-bottom:8px;}
.watch-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
#watchChannel{font-size:14px;font-weight:500;color:var(--text);}
#watchStats{font-size:14px;color:var(--text2);}
.watch-actions{display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{
  display:flex;align-items:center;gap:6px;
  padding:0 12px;height:36px;border-radius:18px;
  background:var(--bg2);font-size:14px;font-weight:500;
  transition:background .15s;
  border:none;cursor:pointer;color:var(--text);
}
.action-btn:hover{background:var(--bg3);}
.action-btn .icon{font-size:18px;}
.watch-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.desc-box{background:var(--bg2);border-radius:12px;padding:12px;font-size:14px;color:var(--text2);line-height:1.5;}

/* UP NEXT */
.upnext-col{position:sticky;top:72px;}
.upnext-title{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text);}
.upnext-card{display:flex;gap:8px;cursor:pointer;padding:4px;border-radius:8px;transition:background .15s;margin-bottom:4px;}
.upnext-card:hover{background:var(--hover);}
.upnext-thumb{width:168px;flex-shrink:0;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;position:relative;}
.upnext-thumb img{width:100%;height:100%;object-fit:cover;}
.upnext-dur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:500;padding:1px 3px;border-radius:3px;}
.upnext-info{flex:1;overflow:hidden;}
.upnext-info .t{font-size:13px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);margin-bottom:4px;}
.upnext-info .c{font-size:12px;color:var(--text2);}
.upnext-info .s{font-size:12px;color:var(--text2);}

/* RESPONSIVE */
@media(max-width:1200px){
  #watchLayout{grid-template-columns:1fr;}
  .upnext-col{position:static;}
}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #videoGrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
}
@media(max-width:600px){
  #videoGrid{grid-template-columns:1fr;}
  .header-center{max-width:none;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="header-left">
    <button id="menuBtn" aria-label="Menu"><span></span></button>
    <div class="logo" id="homeBtn" style="cursor:pointer" role="button" tabindex="0">

    </div>
    <div class="sidebar-item">

    </div>
    <div class="sidebar-item">

    </div>
    <div class="sidebar-item">
      <span class="icon">⏰</span><span>Watch later</span>
    </div>
    <div class="sidebar-item">
      <span class="icon">👍</span><span>Liked videos</span>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">Explore</div>
    <div class="sidebar-item">

  <!-- MAIN -->

<script>
"use strict";

const API_KEY = "__YOUTUBE_API_KEY__";
const API_BASE = "https://www.googleapis.com/youtube/v3";

const $ = id => document.getElementById(id);

// ── helpers ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtViews(n) {
  n = parseInt(n) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B views';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M views';
  if (n >= 1e3) return (n/1e3).toFixed(0)+'K views';
  return n+' views';
}
function fmtAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+' minutes ago';
  if (s < 86400) return Math.floor(s/3600)+' hours ago';
  if (s < 2592000) return Math.floor(s/86400)+' days ago';
  if (s < 31536000) return Math.floor(s/2592000)+' months ago';
  return Math.floor(s/31536000)+' years ago';
}
function fmtDuration(iso) {
  if (!iso) return '';
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h = parseInt(m[1])||0, min = parseInt(m[2])||0, s = parseInt(m[3])||0;
  if (h) return h+':'+(min<10?'0':'')+min+':'+(s<10?'0':'')+s;
  return min+':'+(s<10?'0':'')+s;
}
function initials(name) {
  return (name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

// ── API key check ─────────────────────────────────────────────────────────────
function hasKey() {
  return API_KEY && API_KEY !== '__YOUTUBE_API_KEY__' && API_KEY.trim().length > 0;
}
function setStatus(ok, msg) {
  const el = $('apiStatus');
  el.textContent = ok ? 'API running' : ('API offline' + (msg ? ' — ' + msg : ''));
  el.className = ok ? 'ok' : 'err';
}

// ── fetch ─────────────────────────────────────────────────────────────────────
async function apiReq(endpoint, params = {}) {
  if (!hasKey()) { setStatus(false, 'no key'); throw new Error('No API key'); }
  const url = new URL(API_BASE + '/' + endpoint);
  Object.entries({ ...params, key: API_KEY }).forEach(([k,v]) => v != null && url.searchParams.set(k, v));
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok || data.error) {
    const msg = data?.error?.message || 'HTTP ' + res.status;
    setStatus(false, msg); throw new Error(msg);
  }
  setStatus(true);
  return data;
}

// ── queue ─────────────────────────────────────────────────────────────────────
let queue = [];
function setQueue(vids) { queue = vids; }
function removeFromQueue(id) { queue = queue.filter(v => v.id !== id); }

// ── skeleton ──────────────────────────────────────────────────────────────────
function renderSkeletons(n) {
  let html = '';
  for (let i = 0; i < n; i++) {
    html += `<div class="video-card">
      <div class="thumb-wrap skel-thumb skeleton"></div>
      <div class="video-meta">
        <div class="avatar skeleton" style="flex-shrink:0"></div>
        <div style="flex:1">
          <div class="skel-line skeleton"></div>
          <div class="skel-line short skeleton"></div>
          <div class="skel-line shorter skeleton"></div>
        </div>
      </div>
    </div>`;
  }
  $('videoGrid').innerHTML = html;
}

// ── render feed ───────────────────────────────────────────────────────────────
function renderGrid(videos) {
  const g = $('videoGrid');
  if (!videos.length) { g.innerHTML = '<p class="msg">No videos found.</p>'; return; }
  setQueue(videos);
  g.innerHTML = videos.map(v => {
    const dur = v.duration ? `<span class="thumb-duration">${esc(v.duration)}</span>` : '';
    const av = v.channelThumb
      ? `<img src="${esc(v.channelThumb)}" alt="">`
      : initials(v.channel);
    return `<div class="video-card" onclick="playVideo('${esc(v.id)}')">
      <div class="thumb-wrap">
        <img src="${esc(v.thumb)}" alt="${esc(v.title)}" loading="lazy">
        ${dur}
      </div>
      <div class="video-meta">
        <div class="avatar">${av}</div>
        <div class="video-info">
          <div class="video-title">${esc(v.title)}</div>
          <div class="video-channel">${esc(v.channel)}</div>
          <div class="video-stats">${v.views ? fmtViews(v.views)+' • ' : ''}${fmtAgo(v.publishedAt)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── trending ──────────────────────────────────────────────────────────────────
async function loadTrending(q) {
  showFeed();
  renderSkeletons(24);
  try {
    let items;
    if (!q) {
      const d = await apiReq('videos', { part: 'snippet,statistics,contentDetails', chart: 'mostPopular', maxResults: 24, regionCode: 'US' });
      items = (d.items || []).map(i => ({
        id: i.id,
        title: i.snippet.title,
        channel: i.snippet.channelTitle,
        thumb: i.snippet.thumbnails?.maxres?.url || i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url,
        views: i.statistics?.viewCount,
        publishedAt: i.snippet.publishedAt,
        duration: fmtDuration(i.contentDetails?.duration),
      }));
    } else {
      const d = await apiReq('search', { part: 'snippet', type: 'video', maxResults: 24, q });
      const ids = (d.items || []).map(i => i.id.videoId).join(',');
      const d2 = ids ? await apiReq('videos', { part: 'statistics,contentDetails', id: ids }) : { items: [] };
      const statsMap = {};
      (d2.items || []).forEach(i => { statsMap[i.id] = i; });
      items = (d.items || []).map(i => {
        const extra = statsMap[i.id.videoId] || {};
        return {
          id: i.id.videoId,
          title: i.snippet.title,
          channel: i.snippet.channelTitle,
          thumb: i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url,
          views: extra.statistics?.viewCount,
          publishedAt: i.snippet.publishedAt,
          duration: fmtDuration(extra.contentDetails?.duration),
        };
      });
    }
    renderGrid(items);
  } catch(e) {
    $('videoGrid').innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  }
}

// ── search ────────────────────────────────────────────────────────────────────
async function doSearch(q) {
  if (!q) return;
  showFeed();
  renderSkeletons(20);
  try {
    const d = await apiReq('search', { part: 'snippet', type: 'video', maxResults: 20, q });
    const ids = (d.items || []).map(i => i.id.videoId).join(',');
    const d2 = ids ? await apiReq('videos', { part: 'statistics,contentDetails', id: ids }) : { items: [] };
    const statsMap = {};
    (d2.items || []).forEach(i => { statsMap[i.id] = i; });
    const items = (d.items || []).map(i => {
      const extra = statsMap[i.id.videoId] || {};
      return {
        id: i.id.videoId,
        title: i.snippet.title,
        channel: i.snippet.channelTitle,
        thumb: i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url,
        views: extra.statistics?.viewCount,
        publishedAt: i.snippet.publishedAt,
        duration: fmtDuration(extra.contentDetails?.duration),
      };
    });
    renderGrid(items);
  } catch(e) {
    $('videoGrid').innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  }
}

// ── play ──────────────────────────────────────────────────────────────────────
async function playVideo(id) {
  showWatch();
  $('player').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
  $('watchTitle').textContent = 'Loading…';
  $('watchChannel').textContent = '';
  $('watchStats').textContent = '';
  $('watchDesc').textContent = '';
  removeFromQueue(id);
  renderUpNext();
  try {
    const d = await apiReq('videos', { part: 'snippet,statistics', id });
    const v = d.items?.[0];
    if (!v) return;
    const sn = v.snippet, st = v.statistics;
    $('watchTitle').textContent = sn.title || '';
    $('watchChannel').textContent = sn.channelTitle || '';
    $('watchStats').textContent = [
      st?.viewCount ? fmtViews(st.viewCount) : '',
      fmtAgo(sn.publishedAt)
    ].filter(Boolean).join(' • ');
    $('watchDesc').textContent = sn.description || 'No description available.';
  } catch(e) {
    $('watchTitle').textContent = 'Could not load details.';
  }
}

// ── up next ───────────────────────────────────────────────────────────────────
function renderUpNext() {
  const list = $('upNextList');
  const vids = queue.slice(0, 12);
  if (!vids.length) { list.innerHTML = '<p class="msg" style="padding:20px 0;text-align:left">No more videos.</p>'; return; }
  list.innerHTML = vids.map(v => `
    <div class="upnext-card" onclick="playVideo('${esc(v.id)}')">
      <div class="upnext-thumb">
        <img src="${esc(v.thumb)}" alt="${esc(v.title)}" loading="lazy">
        ${v.duration ? `<span class="upnext-dur">${esc(v.duration)}</span>` : ''}
      </div>
      <div class="upnext-info">
        <div class="t">${esc(v.title)}</div>
        <div class="c">${esc(v.channel)}</div>
        <div class="s">${v.views ? fmtViews(v.views)+' • ' : ''}${fmtAgo(v.publishedAt)}</div>
      </div>
    </div>`).join('');
}

// ── view switchers ────────────────────────────────────────────────────────────
function showFeed() {
  $('feedView').style.display = 'block';
  $('watchView').style.display = 'none';
  $('player').src = '';
}
function showWatch() {
  $('feedView').style.display = 'none';
  $('watchView').style.display = 'block';
}

// ── chips ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    loadTrending(chip.dataset.q);
  });
});

// ── events ────────────────────────────────────────────────────────────────────
$('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('searchInput').value.trim();
  if (q) doSearch(q);
});

$('homeBtn').addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.chip[data-q=""]').classList.add('active');
  $('searchInput').value = '';
  loadTrending('');
});
$('homeBtn').addEventListener('keydown', e => { if (e.key === 'Enter') $('homeBtn').click(); });

$('sideHome').addEventListener('click', () => $('homeBtn').click());

$('menuBtn').addEventListener('click', () => $('sidebar').classList.toggle('open'));

// ── init ──────────────────────────────────────────────────────────────────────
if (!hasKey()) {
  setStatus(false, 'no key');
  $('videoGrid').innerHTML = `<p class="msg err">Replace <code>__YOUTUBE_API_KEY__</code> with your YouTube Data API v3 key.</p>`;
} else {
  loadTrending('');
}
</script>
</body>
</html>
